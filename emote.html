<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucia Naruto Emotion Pack</title>
<style>
  :root {
    --sand: #e0cda8;
    --ink: #17191c;
    --sigh: #e6f4fa;
    --vermilion: #c9483a;
    --paper: #f4ead2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    background: var(--sand);
    border: 2px solid var(--ink);
    border-radius: 18px;
    padding: 22px 26px 18px;
    max-width: 560px;
    width: 100%;
    box-shadow: 6px 6px 0 rgba(23,25,28,.18);
  }
  h1 {
    font-size: 1.05rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin: 0 0 4px;
    text-align: center;
    font-weight: 600;
  }
  .sub {
    text-align: center;
    font-size: .78rem;
    opacity: .65;
    margin: 0 0 14px;
    font-style: italic;
  }
  .stage {
    display: flex;
    justify-content: center;
    margin-bottom: 6px;
  }
  .stage svg {
    width: min(300px, 70vw);
    height: auto;
    display: block;
  }
  .status {
    text-align: center;
    font-size: .8rem;
    min-height: 1.3em;
    margin-bottom: 12px;
    opacity: .8;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  @media (max-width: 460px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  button {
    font-family: inherit;
    font-size: .78rem;
    padding: 8px 4px;
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    transition: transform .06s ease;
    line-height: 1.25;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(1px); }
  button.on {
    background: var(--ink);
    color: var(--sand);
  }
  button .m { display: block; font-size: .68rem; opacity: .6; }
  .foot {
    margin-top: 14px;
    text-align: center;
    font-size: .68rem;
    opacity: .55;
  }
  .foot code { font-family: ui-monospace, "Cascadia Code", Menlo, monospace; }
</style>
</head>

const S = {};

               g24:['path10','path24'], g26:['path7','path31'], g30:['path29','path30']};

  for (const [gid, [l, r]] of Object.entries(ids)) {
    const smp = (pid, ref) => {
      const el = document.getElementById(pid);
      const len = el.getTotalLength();
      const n = OPEN.has(gid) ? NP / 2 : NP;
      let pts = [];
      for (let k = 0; k < n; k++) {
        const p = el.getPointAtLength(len * k / (n - 1));
        pts.push([p.x, p.y]);
      }
      const d0 = Math.hypot(pts[0][0]-ref[0], pts[0][1]-ref[1]);
      const d1 = Math.hypot(pts[n-1][0]-ref[0], pts[n-1][1]-ref[1]);
      if (d1 < d0) pts.reverse();
      if (OPEN.has(gid)) pts = pts.concat(pts.slice().reverse());
      return pts;
    };
    S[gid] = {L: smp(l, refL), R: smp(r, refR)};
  }

    el.style.opacity = op;
    el.style.fill = col;
    const tx = SMC.cx * (1 - s), ty = SMC.cy * (1 - s) + rise;
    el.setAttribute('transform',
      `translate(${tx.toFixed(2)} ${ty.toFixed(2)})scale(${s})`);
    el.setAttribute('d',
      'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + 'Z');
  }
  // apply this frame's fx: [gid, opacity, scaleX, scaleY, rise, rotation]
  for (const [gid, op, sx, sy, rise, rot] of fx) {
    const g = FX[gid];
    g.el.style.opacity = op;
    if (g.body) continue;                       // body groups: opacity only
    g.el.style.display = 'inline';
    const tx = g.cx * (1 - sx), ty = g.cy * (1 - sy) + rise;
    let tr = `${g.base} translate(${tx.toFixed(2)} ${ty.toFixed(2)})scale(${sx} ${sy})`;
    if (rot) tr += `rotate(${rot} ${g.cx.toFixed(2)} ${g.cy.toFixed(2)})`;
    g.el.setAttribute('transform', tr);
  }
  // 2.5D turn: dx is the turn parameter, not raw pixels.
  // Head: modest translate + rotation around the neck (pivot in local coords).
  // Features (g11): lead the turn AND compress slightly (foreshortening).
  // Hair (g1): stays glued to the skull; its lag lives in the tuft springs.
  const rot = (0.9 * dx).toFixed(3);
  document.getElementById('g23').setAttribute('transform',
    `translate(${(11.449 + 0.55 * dx).toFixed(3)} ${6.862 + dy})` +
    `scale(.87579)rotate(${rot} 86.6 163)`);
  const sx = 1 - 0.004 * Math.abs(dx);
  const fxc = 86.6 * (1 - sx);   // keep the x-squash centered on the face
  document.getElementById('g11').setAttribute('transform',
    `translate(${(0.55 * dx + fxc).toFixed(3)} 0)scale(${sx.toFixed(4)} 1)`);
  for (const [side, pid] of [['L','morphL'], ['R','morphR']]) {
    const A = S[sa][side], B = S[sb][side];
    const pts = A.map((p, k) => [p[0] + (B[k][0]-p[0]) * t, p[1] + (B[k][1]-p[1]) * t]);
    document.getElementById(pid).setAttribute('d',
      'M' + pts.map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('L'));
  }
  document.getElementById('g25').style.opacity = veinOp;
  document.getElementById('g28').style.display = rays ? 'inline' : 'none';
  const g32 = document.getElementById('g32');
  if (sigh) {
    g32.style.display = 'inline';
    g32.style.opacity = sigh.o;
    g32.setAttribute('transform', `translate(${sigh.dx} ${sigh.dyp}) ` + G32_BASE);
  } else {
    g32.style.display = 'none';
  }
  angles.forEach((a, j) => {
    const [id, cx, cy] = TUFTS[j];
    document.getElementById(id).setAttribute('transform', `rotate(${a} ${cx} ${cy})`);
  });
}

// ---- player ----
let cur = null, idx = 0, timer = null;
const statusEl = document.getElementById('status');

function stop() { if (timer) { clearInterval(timer); timer = null; } }

function play(key) {
  stop();
  cur = key;
  idx = 0;
  const a = DATA[key];
  document.querySelectorAll('#buttons button').forEach(b =>
    b.classList.toggle('on', b.dataset.key === key));
  statusEl.textContent = a.label + (a.loop ? '  \u27f3 loop' : '  \u2192 one-shot');
  timer = setInterval(() => {
    applyFrame(a.frames[idx]);
    idx++;
    if (idx >= a.frames.length) {
      if (a.loop) { idx = 0; }
      else { stop(); statusEl.textContent = a.label + '  \u2192 done (click to replay)'; }
    }
  }, 1000 / FPS);
}

const grid = document.getElementById('buttons');
for (const key of ORDER) {
  const a = DATA[key];
  const b = document.createElement('button');
  b.dataset.key = key;
  b.innerHTML = a.label + '<span class="m">' + (a.loop ? '\u27f3 loop' : '\u2192 once') + '</span>';
  b.onclick = () => play(key);
  grid.appendChild(b);
}

play('idle_blink');
</script>
