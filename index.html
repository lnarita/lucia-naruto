<title>Lucia Naruto &mdash; 名刺</title>
<style>
  :root {
    --sand: #e0cda8;
    --ink: #17191c;
    --sigh: #e6f4fa;
    --vermilion: #c9483a;
    --paper: #f4ead2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px 14px;
  }
  .meishi {
    container-type: inline-size;
    width: min(560px, 94vw);
    aspect-ratio: 91 / 55;
    background: var(--sand);
    border: 2px solid var(--ink);
    border-radius: 4.5cqw;
    box-shadow: 5px 5px 0 rgba(23,25,28,.16);
    display: grid;
    grid-template-columns: 38% 62%;
    overflow: hidden;
  }
  .portrait {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .portrait svg { width: 88%; height: auto; display: block; }
  .field {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 5cqw 6cqw 5cqw 1cqw;
    min-width: 0;
  }
  .kana {
    font-size: 2.6cqw;
    letter-spacing: .35em;
    opacity: .55;
    margin: 0 0 .6cqw;
  }
  h1 {
    font-size: 6.4cqw;
    margin: 0;
    font-weight: 600;
    letter-spacing: .02em;
    line-height: 1.12;
    white-space: nowrap;
  }
  /* name morph: each differing run is a slot holding both spellings */
  .slot {
    display: inline-grid;
    vertical-align: baseline;
    overflow: hidden;
  }
  .morph-ready .slot { transition: width .5s cubic-bezier(.5,0,.2,1); }
  .slot .va, .slot .vb {
    grid-area: 1 / 1;
    white-space: pre;
    width: max-content;
    transition: opacity .45s ease, transform .45s ease;
  }
  .slot .va { opacity: 1; transform: translateY(0); }
  .slot .vb { opacity: 0; transform: translateY(.5em); }
  .show-b .slot .va { opacity: 0; transform: translateY(-.5em); }
  .show-b .slot .vb { opacity: 1; transform: translateY(0); }
  .title {
    font-size: 3.1cqw;
    font-style: italic;
    opacity: .78;
    margin: 1.4cqw 0 0;
  }
  .rule {
    border: 0;
    border-top: 1px solid var(--ink);
    opacity: .35;
    margin: 3.2cqw 0;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 1.5cqw;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 2.9cqw;
  }
  .links a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px dotted rgba(23,25,28,.45);
    width: fit-content;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .links a:active { color: var(--vermilion); }
  .corner {
    position: absolute;
  }
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .actions button, .actions a {
    font-family: inherit;
    font-size: .82rem;
    padding: 9px 16px;
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    background: var(--sand);
    color: var(--ink);
    cursor: pointer;
    text-decoration: none;
    transition: transform .06s ease;
  }
  .actions button:hover, .actions a:hover { transform: translateY(-1px); }
  .hint {
    font-size: .72rem;
    opacity: .5;
    font-style: italic;
    text-align: center;
    margin: 0;
  }
</style>
</head>

function lcsSegments(a, b) {
  // char-level LCS -> segments [{s:"same text"}] / [{a:"..", b:".."}]
  const n = a.length, m = b.length;
  const dp = Array.from({length: n+1}, () => new Array(m+1).fill(0));
  for (let i = n-1; i >= 0; i--)
    for (let j = m-1; j >= 0; j--)
      dp[i][j] = a[i] === b[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const segs = [];
  let i = 0, j = 0, mode = null;
  const addSame = ch => {
    if (mode !== 's') { segs.push({s: ch}); mode = 's'; }
    else segs[segs.length-1].s += ch;
  };
  const addDiff = (ka, kb) => {
    if (mode !== 'd') { segs.push({a: ka, b: kb}); mode = 'd'; }
    else { segs[segs.length-1].a += ka; segs[segs.length-1].b += kb; }
  };
  while (i < n && j < m) {
    if (a[i] === b[j]) { addSame(a[i]); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]) { addDiff(a[i], ''); i++; }
    else { addDiff('', b[j]); j++; }
  }
  while (i < n) { addDiff(a[i], ''); i++; }
  while (j < m) { addDiff('', b[j]); j++; }
  return segs;
}

const nameEl = document.getElementById("f-name");
const nameA = unset(CONFIG.nameA) ? "Lucia Naruto" : CONFIG.nameA;
const nameB = unset(CONFIG.nameB) ? "" : CONFIG.nameB;
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!nameB || nameB === nameA || reduced) {
  nameEl.textContent = (reduced && nameB) ? nameB : nameA;
} else {
  const segs = lcsSegments(nameA, nameB);
  let slotCount = 0;
  for (const seg of segs) {
    if ('s' in seg) {
      nameEl.appendChild(document.createTextNode(seg.s));
    } else {
      const slot = document.createElement("span");
      slot.className = "slot";
      slot.style.transitionDelay = (slotCount * 110) + "ms";
      const va = document.createElement("span");
      va.className = "va"; va.textContent = seg.a;
      va.style.transitionDelay = (slotCount * 110) + "ms";
      const vb = document.createElement("span");
      vb.className = "vb"; vb.textContent = seg.b;
      vb.style.transitionDelay = (slotCount * 110) + "ms";
      slot.appendChild(va); slot.appendChild(vb);
      nameEl.appendChild(slot);
      slotCount++;
    }
  }
  // measure both variants, then drive width + flip together
  const slots = [...nameEl.querySelectorAll(".slot")];
  const sizeSlots = (toB) => {
    for (const s of slots) {
      const w = toB ? s.querySelector(".vb").offsetWidth
                    : s.querySelector(".va").offsetWidth;
      s.style.width = w + "px";
    }
  };
  requestAnimationFrame(() => {
    sizeSlots(false);
    nameEl.classList.add("morph-ready");
    let onB = false;
    setInterval(() => {
      onB = !onB;
      nameEl.classList.toggle("show-b", onB);
      sizeSlots(onB);
    }, 3400);
  });
}
const linksEl = document.getElementById("f-links");
for (const l of CONFIG.links) {
  if (unset(l.url)) continue;
  const a = document.createElement("a");
  a.href = l.url;
  a.textContent = unset(l.label) ? l.url : l.label;
  linksEl.appendChild(a);
}
if (!linksEl.children.length) {
  linksEl.style.display = "none";
  document.querySelector(".rule").style.display = "none";
}
const sheetA = document.getElementById("sheet");
if (CONFIG.sheetUrl && !CONFIG.sheetUrl.startsWith("{{")) {
  sheetA.href = CONFIG.sheetUrl;
} else {
  sheetA.style.display = "none";
}

// ---- rig setup ----
const S = {};
(function setup() {
  const ids = {g7:['path19','path19-5'], g6:['path3','path6'], g8:['path1','path8'],
               g24:['path10','path24'], g26:['path7','path31'], g30:['path29','path30']};
  const NP = 30;
  const OPEN = new Set(['g7','g30']);
  const refL = [71.476, 115.386], refR = [101.806, 115.158];
  for (const [gid, [l, r]] of Object.entries(ids)) {
    const smp = (pid, ref) => {
      const el = document.getElementById(pid);
      const len = el.getTotalLength();
      const n = OPEN.has(gid) ? NP / 2 : NP;
      let pts = [];
      for (let k = 0; k < n; k++) {
        const p = el.getPointAtLength(len * k / (n - 1));
        pts.push([p.x, p.y]);
      }
      const d0 = Math.hypot(pts[0][0]-ref[0], pts[0][1]-ref[1]);
      const d1 = Math.hypot(pts[n-1][0]-ref[0], pts[n-1][1]-ref[1]);
      if (d1 < d0) pts.reverse();
      if (OPEN.has(gid)) pts = pts.concat(pts.slice().reverse());
      return pts;
    };
    S[gid] = {L: smp(l, refL), R: smp(r, refR)};
  }
  for (const g of ['g7','g6','g8','g24','g26','g30']) {
    document.getElementById(g).style.display = 'none';
  }
  const g11 = document.getElementById('g11');
  for (const nm of ['morphL','morphR']) {
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.id = nm;
    p.setAttribute('style',
      'fill:none;stroke:#17191c;stroke-width:1.97793;stroke-linecap:round;stroke-linejoin:round');
    g11.appendChild(p);
  }
})();

function applyFrame(f) {
  const [dy, sa, sb, t, veinOp, rays, sigh, dx, angles] = f;
  const rot = (0.9 * dx).toFixed(3);
  document.getElementById('g23').setAttribute('transform',
    `translate(${(11.449 + 0.55 * dx).toFixed(3)} ${6.862 + dy})` +
    `scale(.87579)rotate(${rot} 86.6 163)`);
  const sx = 1 - 0.004 * Math.abs(dx);
  const fxc = 86.6 * (1 - sx);
  document.getElementById('g11').setAttribute('transform',
    `translate(${(0.55 * dx + fxc).toFixed(3)} 0)scale(${sx.toFixed(4)} 1)`);
  for (const [side, pid] of [['L','morphL'], ['R','morphR']]) {
    const A = S[sa][side], B = S[sb][side];
    const pts = A.map((p, k) => [p[0] + (B[k][0]-p[0]) * t, p[1] + (B[k][1]-p[1]) * t]);
    document.getElementById(pid).setAttribute('d',
      'M' + pts.map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('L'));
  }
  document.getElementById('g25').style.opacity = veinOp;
  document.getElementById('g28').style.display = rays ? 'inline' : 'none';
  const g32 = document.getElementById('g32');
  if (sigh) {
    g32.style.display = 'inline';
    g32.style.opacity = sigh.o;
    g32.setAttribute('transform', `translate(${sigh.dx} ${sigh.dyp}) ` + G32_BASE);
  } else {
    g32.style.display = 'none';
  }
  angles.forEach((a, j) => {
    const [id, cx, cy] = TUFTS[j];
    document.getElementById(id).setAttribute('transform', `rotate(${a} ${cx} ${cy})`);
  });
}

// ---- player: idle always; taps queue greetings; spam earns an opinion ----
let cur = "idle", idx = 0, timer = null;
let tapTimes = [];

function play(key, done) {
  clearInterval(timer);
  cur = key; idx = 0;
  const a = DATA[key];
  timer = setInterval(() => {
    applyFrame(a.frames[idx]);
    idx++;
    if (idx >= a.frames.length) {
      if (a.loop) { idx = 0; }
      else { clearInterval(timer); (done || (() => play("idle")))(); }
    }
  }, 1000 / FPS);
}

document.getElementById("portrait").addEventListener("click", () => {
  const now = Date.now();
  tapTimes = tapTimes.filter(t => now - t < 4000);
  tapTimes.push(now);
  if (tapTimes.length >= 5) {
    tapTimes = [];
    play("disapprove");           // she has opinions about spam
  } else if (cur === "idle") {
    play(Math.random() < 0.75 ? "hello" : "surprise");
  }
});

play("idle");
