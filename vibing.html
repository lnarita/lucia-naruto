<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucia Vibe Mode</title>
<style>
  :root { --sand:#e0cda8; --ink:#17191c; --paper:#f4ead2; --verm:#c9483a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: Georgia, "Iowan Old Style", serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px 14px;
  }
  .card {
    background: var(--sand); border: 2px solid var(--ink); border-radius: 18px;
    padding: 18px 22px 14px; width: min(480px, 94vw);
    box-shadow: 6px 6px 0 rgba(23,25,28,.18); text-align: center;
  }
  .stage svg { width: min(320px, 78vw); height: auto; }
  .status { font-size: .8rem; min-height: 1.2em; opacity: .75; font-style: italic; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  button {
    font-family: inherit; font-size: .8rem; padding: 8px 14px;
    border: 1.5px solid var(--ink); border-radius: 10px;
    background: var(--paper); color: var(--ink); cursor: pointer;
  }
  button:hover { transform: translateY(-1px); }
  button.on { background: var(--ink); color: var(--sand); }
  audio { width: 100%; height: 30px; margin-top: 10px; display: none; }
  .hint { font-size: .68rem; opacity: .5; margin: 2px 0 0; font-style: italic; }
</style>
</head>

        <path id="path33" d="M49.483 112.737c-1.878 2.172-2.29 6.527-1.377 9.417.976 2.496 4.384.584 4.893 3.416.235 2.172-.471 5.01 2.262 5.856 2.434.646 3.781 3.315 5.792 4.541 2.027.816 4.37-1.103 5.988 1.08 1.583 1.792 2.703 3.586 6.219 4.441s7.073.369 10.272 1.142c3.198.774 5.547 3.358 5.547 3.358-.274-1.642-5.493-7.715-9.38-8.17-3.245-1.154-5.898-4.105-7.502-6.816-1.694-1.874-5.648-2.575-6.281-5.367-.03-2.194 1.273-4.314.562-6.573-.626-2.992-3.114-7.06-6.333-8.056-3.218-.997-8.115-1.486-10.662 1.731" style="display:inline;fill:#faa;fill-opacity:1;stroke:none;stroke-width:.302108px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1"/>
        <path id="path35" d="M60.207 64.212c-3.404 9.698 10.07 16.182 11.882 21.967s9.581 2.236 15.286 6.803c5.706 4.566 10.92 13.43 18.657 12.42 7.738-1.008 16.63 10.75 19.68 3.375 3.05-7.374-3.769-11.684-6.78-18.63-3.01-6.945-13.693-.178-20.96-4.835-7.266-4.658-7.203-8.483-14.274-10.216-7.072-1.733-18.634 3.464-23.491-10.884" style="display:inline;fill:#faa;fill-opacity:1;stroke:none;stroke-width:.322269px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1"/>
      </g>
      <g id="g40" style="display:inline" transform="translate(8.154 .741)">
        <path id="path39" d="M73.518 77.608c5.67 4.303 6.78 2.319 11.722 3.955s-1.23 4.626 5.33 8.339c2.532 1.433 2.961 6.628 5.972 6.208 3.464-.482 8.153 3.708 5.383-4.036s-4.244-5.745-8.534-6.954-2.057-3.306-5.518-5.772c-3.023-1.814-8.006 1.869-14.355-1.74" style="fill:#fca;fill-opacity:1;stroke:none;stroke-width:.302108px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1"/>
        <path id="path40" d="M56.278 125.494c-2.285-.504-3.727-2.122-5.167-.321s-.464 6.161 3.49 5.749c3.954-.413 6.38 6.754 10.148 8.149s4.26 2.965 4.67 4.593c.184-2.294-1.066-4.171-2.944-5.455s-4-2.745-4.436-5.078-3.476-7.133-5.76-7.637" style="fill:#fca;fill-opacity:1;stroke:none;stroke-width:.302108px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1"/>
      </g>
      <g id="g41" style="display:inline" transform="rotate(-11.987 121.586 77.48)">
        <path id="path41" d="M108.894 75.139c.797-.768 5.184-1.843 6.194 0-1.32.887-5.92 5.318-6.194 6.577.782.948 5.752.51 6.194 0" style="fill:none;stroke:#17191c;stroke-width:1.68272;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:1"/>
        <path id="path41-4" d="M113.813 67.686c1.147-.614 6.452-.427 7.005 1.98-1.776.581-8.396 4.121-9.109 5.458.581 1.321 6.341 2.417 7.005 1.98" style="fill:none;stroke:#17191c;stroke-width:1.97764;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:1"/>
        <path id="path41-1" d="M113.704 80.54c.84-.337 4.495.195 4.695 1.903-1.273.267-6.121 2.212-6.715 3.083.301.958 4.202 2.153 4.695 1.902" style="fill:none;stroke:#17191c;stroke-width:1.37621;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:1"/>
      </g>
    </g>
  </g>
</svg>
</div>
  <div class="status" id="status">pick a sound source &mdash; she's waiting</div>
  <div class="row">
    <button id="btnTab">&#128421; tab / screen audio</button>
    <button id="btnFile">&#127925; play a file</button>
    <button id="btnMic">&#127908; microphone</button>
  </div>
  <audio id="player" controls loop></audio>
  <input id="filein" type="file" accept="audio/*" style="display:none">
  <p class="hint">linux tip: route the mic to "Monitor of &lt;sink&gt;" in pavucontrol
  and she hears everything the machine plays</p>
</div>

<script>
// ---------- rig setup ----------
const S = {};
// pivots sit at each tuft's root, just inside the face fill (path42),
// so the buried end sweeps under the fill instead of opening a gap
const TUFTS = [["path17",67.0,117.0,0.8],["path15",67.5,120.5,1.0],
               ["path16",107.2,120.0,1.0],["path18",107.0,119.5,0.8]];
const ZZZ = ['path41-1','path41','path41-4'];   // small -> large
(function setup() {
  const ids = {g7:['path19','path19-5'], g6:['path3','path6'], g8:['path1','path8']};
  const NP = 30, refL = [71.476,115.386], refR = [101.806,115.158];
  const OPEN = new Set(['g7']);
  for (const [gid,[l,r]] of Object.entries(ids)) {
    const smp = (pid, ref) => {
      const el = document.getElementById(pid);
      const len = el.getTotalLength();
      const n = OPEN.has(gid) ? NP/2 : NP;
      let pts = [];
      for (let k = 0; k < n; k++) {
        const p = el.getPointAtLength(len*k/(n-1));
        pts.push([p.x, p.y]);
      }
      const d0 = Math.hypot(pts[0][0]-ref[0], pts[0][1]-ref[1]);
      const d1 = Math.hypot(pts[n-1][0]-ref[0], pts[n-1][1]-ref[1]);
      if (d1 < d0) pts.reverse();
      if (OPEN.has(gid)) pts = pts.concat(pts.slice().reverse());
      return pts;
    };
    S[gid] = {L: smp(l, refL), R: smp(r, refR)};
  }
  // hide everything not needed: eye states, smoke, naruto, vein, rays, sigh
  for (const g of ['g7','g6','g8','g24','g26','g30',
                   'g39','g36','g38','g35','g40','g27','g28','g32']) {
    const el = document.getElementById(g);
    if (el) el.style.display = 'none';
  }
  document.getElementById('g25').style.opacity = 0;
  for (const z of ZZZ) document.getElementById(z).style.opacity = 0;
  const g11 = document.getElementById('g11');
  for (const nm of ['morphL','morphR']) {
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.id = nm;
    p.setAttribute('style',
      'fill:none;stroke:#17191c;stroke-width:1.97793;stroke-linecap:round;stroke-linejoin:round');
    g11.appendChild(p);
  }
})();

function render(dx, dy, eyeO, surp, angles) {
  const rot = (0.9*dx).toFixed(3);
  document.getElementById('g23').setAttribute('transform',
    `translate(${(11.449+0.55*dx).toFixed(3)} ${(6.862+dy).toFixed(3)})` +
    `scale(.87579)rotate(${rot} 86.6 163)`);
  const sx = 1 - 0.004*Math.abs(dx), fxc = 86.6*(1-sx);
  document.getElementById('g11').setAttribute('transform',
    `translate(${(0.55*dx+fxc).toFixed(3)} 0)scale(${sx.toFixed(4)} 1)`);
  for (const [side, pid] of [['L','morphL'],['R','morphR']]) {
    const A = S.g7[side], B = S.g6[side], C = S.g8[side];
    const pts = A.map((p,k)=>{
      const x0 = p[0]+(B[k][0]-p[0])*eyeO, y0 = p[1]+(B[k][1]-p[1])*eyeO;
      return [x0+(C[k][0]-x0)*surp, y0+(C[k][1]-y0)*surp];
    });
    document.getElementById(pid).setAttribute('d',
      'M'+pts.map(p=>p[0].toFixed(2)+' '+p[1].toFixed(2)).join('L'));
  }
  angles.forEach((a,j)=>{
    const [id,cx,cy] = TUFTS[j];
    document.getElementById(id).setAttribute('transform',`rotate(${a.toFixed(2)} ${cx} ${cy})`);
  });
}

// floating zzz: each glyph loops fade-in / drift-up / fade-out, staggered
// small -> mid -> large like a snore swelling. s gates them as sleep deepens.
function zzz(now, s) {
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById(ZZZ[i]);
    if (s < 0.55) { el.style.opacity = 0; continue; }
    const ph = ((now/2600) + i*0.333) % 1;
    const op = ph < 0.18 ? ph/0.18 : ph < 0.66 ? 1 : (1-ph)/0.34;
    el.style.opacity = (op * (s-0.55)/0.45).toFixed(3);
    el.setAttribute('transform',
      `translate(${(2.2*ph).toFixed(2)} ${(-7*ph).toFixed(2)})`);
  }
}

// ---------- audio ----------
let AC = null, analyser = null, srcNode = null, stream = null;
let playing = false, freq = null;
const statusEl = document.getElementById('status');
const player = document.getElementById('player');

function ensureAC() {
  if (!AC) {
    AC = new (window.AudioContext||window.webkitAudioContext)();
    analyser = AC.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.5;
    freq = new Uint8Array(analyser.frequencyBinCount);
  }
  if (AC.state === 'suspended') AC.resume();
}
function stopSource() {
  if (srcNode) { try { srcNode.disconnect(); } catch(e){} srcNode = null; }
  if (stream) { stream.getTracks().forEach(t=>t.stop()); stream = null; }
  player.pause(); player.style.display = 'none';
  playing = false;
  for (const b of ['btnTab','btnFile','btnMic'])
    document.getElementById(b).classList.remove('on');
}
function setOn(id, msg) {
  document.getElementById(id).classList.add('on');
  statusEl.textContent = msg;
  playing = true;
}

document.getElementById('btnTab').onclick = async () => {
  stopSource(); ensureAC();
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
    stream.getVideoTracks().forEach(t=>t.stop());
    if (!stream.getAudioTracks().length) {
      statusEl.textContent = 'no audio in that share — pick a tab and tick "share tab audio"';
      return;
    }
    srcNode = AC.createMediaStreamSource(stream);
    srcNode.connect(analyser);
    setOn('btnTab', 'listening to the shared audio ♪');
  } catch(e) { statusEl.textContent = 'share cancelled'; }
};
let fileNodeMade = false, fileNode = null;
document.getElementById('btnFile').onclick = () => document.getElementById('filein').click();
document.getElementById('filein').onchange = (ev) => {
  const f = ev.target.files[0];
  if (!f) return;
  stopSource(); ensureAC();
  player.src = URL.createObjectURL(f);
  player.style.display = 'block';
  if (!fileNodeMade) {
    fileNode = AC.createMediaElementSource(player);
    fileNodeMade = true;
  }
  fileNode.connect(analyser);
  fileNode.connect(AC.destination);
  srcNode = fileNode;
  player.play();
  setOn('btnFile', f.name + ' ♪');
};
document.getElementById('btnMic').onclick = async () => {
  stopSource(); ensureAC();
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    srcNode = AC.createMediaStreamSource(stream);
    srcNode.connect(analyser);
    setOn('btnMic', 'listening ♪ (monitor source = whole system)');
  } catch(e) { statusEl.textContent = 'mic denied'; }
};

// ---------- the groove + the nap ----------
const PUMP = [-1, -0.45, -1, 1, 0.45, 1];   // L l L R r R
// drowsy eyelid script over p in 0..1: blink, mostly reopen, heavier
// blink, barely reopen, closed for good (1 = open, 0 = closed)
const DROWSY = [[0,1],[0.13,0.12],[0.24,0.78],[0.42,0.04],[0.53,0.30],[0.72,0],[1,0]];
const SIL_DROWSY = 6000, SIL_ASLEEP = 10500;
let pump = 0, x = 0, xT = 0, dy = 0, kick = 0;
let bassAvg = 12, loudEma = 0, lastBeat = 0;
let eyeO = 1, eyeTarget = 1, surp = 0;       // eyeO: 0 closed .. 1 open
let mode = 'awake', lastSound = performance.now(), startleT0 = 0, sleepF = 0;
let th = [0,0,0,0], w = [0,0,0,0], xTickPrev = 0, prevV = 0;
let angles = [0,0,0,0], anglesPrev = [0,0,0,0], acc = 0, lastT = performance.now();
let beats = 0;
window.__dbg = () => ({x, beats, eyeO, playing, mode, sleepF, surp});
window.__forceSleep = (ms) => { lastSound = performance.now() - (ms||20000); };

function drowsyEye(p) {
  for (let i = 1; i < DROWSY.length; i++) {
    if (p <= DROWSY[i][0]) {
      const [p0,v0] = DROWSY[i-1], [p1,v1] = DROWSY[i];
      return v0 + (v1-v0)*(p-p0)/(p1-p0);
    }
  }
  return 0;
}

function springTick(v) {   // the proven 12 Hz constants (vibing gain)
  const gain = 1.6, k = 0.25, c = 0.30, capIn = 10, capOut = 2.6;
  anglesPrev = angles.slice();
  for (let j = 0; j < 4; j++) {
    const mult = TUFTS[j][3], side = j < 2 ? 1 : -1;
    w[j] += -gain*mult*prevV - k*th[j] - c*w[j];
    th[j] += w[j];
    const lo = side > 0 ? -capIn : -capOut, hi = side > 0 ? capOut : capIn;
    const cl = Math.max(lo, Math.min(hi, th[j]));
    if (cl !== th[j]) w[j] = 0;
    th[j] = cl;
  }
  prevV = v;
  angles = th.slice();
}

function startle(now) {
  mode = 'startle'; startleT0 = now;
  kick = -3.4;
  for (const z of ZZZ) document.getElementById(z).style.opacity = 0;
  // tuft flare: inward impulse, like a full-body flinch
  for (let j = 0; j < 4; j++) w[j] += (j < 2 ? -2.6 : 2.6)*TUFTS[j][3];
  statusEl.textContent = '!!';
}

// FIXME: left in the global scope for easier debugging
let pumpThrsMult = 0.90;
let pumpThrsAdd = 10;

function loop(now) {
  if (window.__freeze) { requestAnimationFrame(loop); return; }   // test hook
  const dt = Math.min(50, now - lastT); lastT = now;
  let bass = 0, total = 0;
  if (analyser && playing) {
    analyser.getByteFrequencyData(freq);
    for (let i = 1; i <= 6; i++) bass += freq[i];
    bass /= 6;
    for (let i = 0; i < 64; i++) total += freq[i];
    total /= 64;
    loudEma = loudEma*0.95 + total*0.05;
    // beat: bass pops above its own recent average
    console.log(`bass: ${bass}; bassAvg: ${bassAvg}; thrs: ${bassAvg*pumpThrsMult + pumpThrsAdd}`);
    if (bass > (bassAvg*pumpThrsMult + pumpThrsAdd) && now - lastBeat > 180) {
      lastBeat = now; beats++;
      pump = (pump + 1) % PUMP.length;
      const amp = 1.1 + Math.min(2.1, loudEma/26);
      xT = PUMP[pump] * amp;
      kick = Math.min(kick, -Math.min(2.4, 0.8 + (bass - bassAvg)/60));
    }
    bassAvg = bassAvg*0.92 + bass*0.08;
  }
  const soundNow = playing && total > 6;
  if (soundNow) lastSound = now;
  const sil = now - lastSound;

  // ---- mode machine ----
  if (mode === 'startle') {
    if (now - startleT0 > 900) {
      mode = 'awake';
      statusEl.textContent = 'okay, okay — awake ♪';
    }
  } else if (mode === 'asleep') {
    if (soundNow) startle(now);          // only true sleep earns the startle
  } else {
    const prev = mode;
    mode = sil > SIL_ASLEEP ? 'asleep' : sil > SIL_DROWSY ? 'drowsy' : 'awake';
    if (mode === 'asleep' && prev !== 'asleep') statusEl.textContent = 'zzz . . .';
  }

  // ---- eyes ----
  let ease = 0.10;
  if (mode === 'startle') {
    const st = now - startleT0;
    surp += ((st < 620 ? 1 : 0) - surp) * 0.45;
    eyeTarget = 0;                       // melt into groove-closed underneath
    // rays flicker: on, off, on, gone
    const g28 = document.getElementById('g28');
    const on = st < 130 || (st > 210 && st < 330);
    g28.style.display = on ? '' : 'none';
  } else {
    surp += (0 - surp) * 0.45;
    if (mode === 'asleep') { eyeTarget = 0; ease = 0.06; }
    else if (mode === 'drowsy') {
      eyeTarget = drowsyEye((sil - SIL_DROWSY)/(SIL_ASLEEP - SIL_DROWSY));
      ease = 0.25;                       // blinks need to land
    } else eyeTarget = (playing && sil < 1800) ? 0 : 1;
  }
  eyeO += (eyeTarget - eyeO) * ease;

  // ---- sleep depth: slow to sink, quick to surface ----
  const sTgt = mode === 'asleep' ? 1 : 0;
  sleepF += (sTgt - sleepF) * (sTgt ? 0.012 : 0.35);

  // ---- motion integration ----
  if (!soundNow) xT *= 0.92;             // groove drains in silence
  x += (xT - x) * 0.30;
  kick *= 0.86;
  const bobAwake = 0.30*Math.sin(now/380);
  const bobSleep = 0.60*Math.sin(now/520) + 1.1;  // deep breath, settled down
  dy = bobAwake + (bobSleep - bobAwake)*sleepF + kick;
  const lean = 2.0*sleepF;
  // tuft springs at the proven 12 Hz, lerped to display rate
  acc += dt;
  if (acc >= 83.3) {
    acc -= 83.3;
    springTick(x - xTickPrev);
    xTickPrev = x;
  }
  const f = Math.min(1, acc/83.3);
  const disp = angles.map((a,j)=>anglesPrev[j] + (a-anglesPrev[j])*f);
  zzz(now, sleepF);
  render(x + lean, dy, eyeO, surp, disp);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// hidden test hook: synthetic beat into the analyser (no speakers)
window.__vibeTest = () => {
  ensureAC();
  const osc = AC.createOscillator(); osc.type = 'sine'; osc.frequency.value = 70;
  const g = AC.createGain(); g.gain.value = 0;
  osc.connect(g); g.connect(analyser);
  osc.start();
  let n = 0;
  setInterval(() => {
    const t = AC.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.02, t + 0.18);
    n++;
  }, 430);
  playing = true;
  statusEl.textContent = 'test groove ♪';
};
</script>
