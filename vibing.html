<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucia Vibe Mode</title>
<style>
  :root { --sand:#e0cda8; --ink:#17191c; --paper:#f4ead2; --verm:#c9483a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: Georgia, "Iowan Old Style", serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px 14px;
  }
  .card {
    background: var(--sand); border: 2px solid var(--ink); border-radius: 18px;
    padding: 18px 22px 14px; width: min(480px, 94vw);
    box-shadow: 6px 6px 0 rgba(23,25,28,.18); text-align: center;
  }
  .stage svg { width: min(320px, 78vw); height: auto; }
  .status { font-size: .8rem; min-height: 1.2em; opacity: .75; font-style: italic; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  button {
    font-family: inherit; font-size: .8rem; padding: 8px 14px;
    border: 1.5px solid var(--ink); border-radius: 10px;
    background: var(--paper); color: var(--ink); cursor: pointer;
  }
  button:hover { transform: translateY(-1px); }
  button.on { background: var(--ink); color: var(--sand); }
  audio { width: 100%; height: 30px; margin-top: 10px; display: none; }
  .hint { font-size: .68rem; opacity: .5; margin: 2px 0 0; font-style: italic; }
</style>
</head>

  <div class="status" id="status">pick a sound source &mdash; she's waiting</div>

    <button id="btnTab">&#128421; tab / screen audio</button>

  and she hears everything the machine plays</p>

<script>
// ---------- rig setup ----------
const S = {};
// pivots sit at each tuft's root, just inside the face fill (path42),
// so the buried end sweeps under the fill instead of opening a gap
const TUFTS = [["path17",67.0,117.0,0.8],["path15",67.5,120.5,1.0],
               ["path16",107.2,120.0,1.0],["path18",107.0,119.5,0.8]];
const ZZZ = ['path41-1','path41','path41-4'];   // small -> large
(function setup() {
  const ids = {g7:['path19','path19-5'], g6:['path3','path6'], g8:['path1','path8']};
  const NP = 30, refL = [71.476,115.386], refR = [101.806,115.158];
  const OPEN = new Set(['g7']);
  for (const [gid,[l,r]] of Object.entries(ids)) {
    const smp = (pid, ref) => {
      const el = document.getElementById(pid);
      const len = el.getTotalLength();
      const n = OPEN.has(gid) ? NP/2 : NP;
      let pts = [];
      for (let k = 0; k < n; k++) {
        const p = el.getPointAtLength(len*k/(n-1));
        pts.push([p.x, p.y]);
      }
      const d0 = Math.hypot(pts[0][0]-ref[0], pts[0][1]-ref[1]);
      const d1 = Math.hypot(pts[n-1][0]-ref[0], pts[n-1][1]-ref[1]);
      if (d1 < d0) pts.reverse();
      if (OPEN.has(gid)) pts = pts.concat(pts.slice().reverse());
      return pts;
    };
    S[gid] = {L: smp(l, refL), R: smp(r, refR)};
  }
  // hide everything not needed: eye states, smoke, naruto, vein, rays, sigh
  for (const g of ['g7','g6','g8','g24','g26','g30',
                   'g39','g36','g38','g35','g40','g27','g28','g32']) {
    const el = document.getElementById(g);
    if (el) el.style.display = 'none';
  }
  document.getElementById('g25').style.opacity = 0;
  for (const z of ZZZ) document.getElementById(z).style.opacity = 0;
  const g11 = document.getElementById('g11');
  // front layer: the eyes ride here and get extra parallax on head turns,
  // so the face reads convex instead of flat (whiskers g2 get the same
  // transform in place, to keep the author's z-order)
  const fg = document.createElementNS('http://www.w3.org/2000/svg','g');
  fg.id = 'gFront';
  g11.appendChild(fg);
  for (const nm of ['morphL','morphR']) {
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.id = nm;
    p.setAttribute('style',
      'fill:none;stroke:#17191c;stroke-width:1.97793;stroke-linecap:round;stroke-linejoin:round');
    fg.appendChild(p);
  }
})();

function render(dx, dy, eyeO, surp, angles) {
  const rot = (0.9*dx).toFixed(3);
  document.getElementById('g23').setAttribute('transform',
    `translate(${(11.449+0.55*dx).toFixed(3)} ${(6.862+dy).toFixed(3)})` +
    `scale(.87579)rotate(${rot} 86.6 163)`);
  const sx = 1 - 0.004*Math.abs(dx), fxc = 86.6*(1-sx);
  document.getElementById('g11').setAttribute('transform',
    `translate(${(0.55*dx+fxc).toFixed(3)} 0)scale(${sx.toFixed(4)} 1)`);
  // convexity: front features (eyes + whiskers) travel farther than the
  // face oval and compress a touch more — three depth layers total
  const s2 = 1 - 0.0025*Math.abs(dx);
  const ftr = `translate(${(0.30*dx + 86.6*(1-s2)).toFixed(3)} 0)scale(${s2.toFixed(4)} 1)`;
  document.getElementById('gFront').setAttribute('transform', ftr);
  document.getElementById('g2').setAttribute('transform', ftr);
  for (const [side, pid] of [['L','morphL'],['R','morphR']]) {
    const A = S.g7[side], B = S.g6[side], C = S.g8[side];
    const pts = A.map((p,k)=>{
      const x0 = p[0]+(B[k][0]-p[0])*eyeO, y0 = p[1]+(B[k][1]-p[1])*eyeO;
      return [x0+(C[k][0]-x0)*surp, y0+(C[k][1]-y0)*surp];
    });
    document.getElementById(pid).setAttribute('d',
      'M'+pts.map(p=>p[0].toFixed(2)+' '+p[1].toFixed(2)).join('L'));
  }
  angles.forEach((a,j)=>{
    const [id,cx,cy] = TUFTS[j];
    document.getElementById(id).setAttribute('transform',`rotate(${a.toFixed(2)} ${cx} ${cy})`);
  });
}

// floating zzz: each glyph loops fade-in / drift-up / fade-out, staggered
// small -> mid -> large like a snore swelling. s gates them as sleep deepens.
function zzz(now, s) {
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById(ZZZ[i]);
    if (s < 0.55) { el.style.opacity = 0; continue; }
    const ph = ((now/2600) + i*0.333) % 1;
    const op = ph < 0.18 ? ph/0.18 : ph < 0.66 ? 1 : (1-ph)/0.34;
    el.style.opacity = (op * (s-0.55)/0.45).toFixed(3);
    el.setAttribute('transform',
      `translate(${(2.2*ph).toFixed(2)} ${(-7*ph).toFixed(2)})`);
  }
}

// ---------- audio ----------
let AC = null, analyser = null, srcNode = null, stream = null;
let playing = false, freq = null;
const statusEl = document.getElementById('status');
const player = document.getElementById('player');

function ensureAC() {
  if (!AC) {
    AC = new (window.AudioContext||window.webkitAudioContext)();
    analyser = AC.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.5;
    freq = new Uint8Array(analyser.frequencyBinCount);
  }
  if (AC.state === 'suspended') AC.resume();
}
function stopSource() {
  if (srcNode) { try { srcNode.disconnect(); } catch(e){} srcNode = null; }
  if (stream) { stream.getTracks().forEach(t=>t.stop()); stream = null; }
  player.pause(); player.style.display = 'none';
  playing = false;
  for (const b of ['btnTab','btnFile','btnMic'])
    document.getElementById(b).classList.remove('on');
}
function setOn(id, msg) {
  document.getElementById(id).classList.add('on');
  statusEl.textContent = msg;
  playing = true;
}

document.getElementById('btnTab').onclick = async () => {
  stopSource(); ensureAC();
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
    stream.getVideoTracks().forEach(t=>t.stop());
    if (!stream.getAudioTracks().length) {
      statusEl.textContent = 'no audio in that share — pick a tab and tick "share tab audio"';
      return;
    }
    srcNode = AC.createMediaStreamSource(stream);
    srcNode.connect(analyser);
    setOn('btnTab', 'listening to the shared audio ♪');
  } catch(e) { statusEl.textContent = 'share cancelled'; }
};
let fileNodeMade = false, fileNode = null;
document.getElementById('btnFile').onclick = () => document.getElementById('filein').click();
document.getElementById('filein').onchange = async (ev) => {
  const f = ev.target.files[0];
  if (!f) return;
  stopSource(); ensureAC();
  baked = null; bkBi = 0; bkPrevT = -1; bkPend = [];
  player.src = URL.createObjectURL(f);
  player.style.display = 'block';
  if (!fileNodeMade) {
    fileNode = AC.createMediaElementSource(player);
    fileNodeMade = true;
  }
  fileNode.connect(analyser);
  fileNode.connect(AC.destination);
  srcNode = fileNode;
  player.play();
  setOn('btnFile', f.name + ' — reading the song… ♪');
  try {
    const b = await bakeTrack(await f.arrayBuffer());
    if (srcNode === fileNode && b.beats.length > 4) {
      baked = b; bkBi = 0; bkPrevT = -1; bkPend = [];
      statusEl.textContent = `${f.name} — she knows this one ♪ (${b.bpm.toFixed(0)} bpm)`;
    }
  } catch (e) { /* undecodable: stay in live mode */ }
};
document.getElementById('btnMic').onclick = async () => {
  stopSource(); ensureAC();
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    srcNode = AC.createMediaStreamSource(stream);
    srcNode.connect(analyser);
    setOn('btnMic', 'listening ♪ (monitor source = whole system)');
  } catch(e) { statusEl.textContent = 'mic denied'; }
};

// ---------- offline bake (After Effects style): study the whole song ----------
let baked = null, bkBi = 0, bkPrevT = -1, bkPend = [];

async function bakeTrack(ab) {
  const buf = await AC.decodeAudioData(ab);
  const sr = buf.sampleRate, N = buf.length;
  // the AE trick, verbatim: duplicate the audio, EQ each copy, envelope each
  async function band(type, fq) {
    const oc = new OfflineAudioContext(1, N, sr);
    const s = oc.createBufferSource(); s.buffer = buf;
    let n = s;
    if (type) { const f = oc.createBiquadFilter(); f.type = type; f.frequency.value = fq; n.connect(f); n = f; }
    n.connect(oc.destination); s.start();
    return (await oc.startRendering()).getChannelData(0);
  }
  const [full, low, high] = await Promise.all(
    [band(null, 0), band('lowpass', 150), band('highpass', 4000)]);
  const hop = Math.round(sr/60), F = Math.floor(N/hop), hopS = hop/sr;
  const env = (d) => {
    const e = new Float32Array(F);
    for (let i = 0; i < F; i++) {
      let s = 0; const o = i*hop;
      for (let j = 0; j < hop; j += 4) s += d[o+j]*d[o+j];
      e[i] = Math.sqrt(s/(hop/4));
    }
    return e;
  };
  const loudE = env(full), bassE = env(low), trebE = env(high);
  let peak = 1e-6;
  for (const v of loudE) peak = Math.max(peak, v);
  for (let i = 0; i < F; i++) { loudE[i] /= peak; bassE[i] /= peak; trebE[i] /= peak; }
  // combined onset envelope (bass thump + weighted treble snap)
  const ons = new Float32Array(F);
  for (let i = 1; i < F; i++)
    ons[i] = Math.max(0, bassE[i]-bassE[i-1])
           + percTrebleWeight*Math.max(0, trebE[i]-trebE[i-1]);
  // tempo: autocorrelation over 300-1500ms lags, log-gauss preference ~115bpm
  const lo = Math.round(0.30/hopS), hi = Math.min(F-2, Math.round(1.50/hopS));
  let P = lo, bestSc = -1;
  for (let L = lo; L <= hi; L++) {
    let s = 0;
    for (let i = L; i < F; i++) s += ons[i]*ons[i-L];
    s /= (F - L);
    s *= Math.exp(-0.5*Math.pow(Math.log2(60/(L*hopS)/115)/0.6, 2));
    if (s > bestSc) { bestSc = s; P = L; }
  }
  // phase: comb offset with the most onset energy on the grid
  let bestOff = 0, bo = -1;
  for (let off = 0; off < P; off++) {
    let s = 0, c = 0;
    for (let i = off; i < F; i += P) { s += ons[i]; c++; }
    if (s/c > bo) { bo = s/c; bestOff = off; }
  }
  // beat times, snapped to nearby onset peaks (absorbs gentle drift)
  let onsMean = 0;
  for (const v of ons) onsMean += v;
  onsMean /= F;
  const beats = [], strength = [], rad = Math.max(1, Math.round(P*0.18));
  let pos = bestOff;
  while (pos < F) {
    const bi = Math.round(pos);
    let bv = -1, bj = bi;
    for (let j = Math.max(0, bi-rad); j <= Math.min(F-1, bi+rad); j++)
      if (ons[j] > bv) { bv = ons[j]; bj = j; }
    beats.push(bj*hopS);
    strength.push(Math.min(3, bv/(onsMean + 1e-9)));
    pos = bi + P + Math.max(-rad, Math.min(rad, bj - bi))*0.5;
  }
  // grv track: 4s forward-looking percussiveness windows every 0.5s —
  // forward-looking means she feels the chorus coming
  const win = Math.round(4/hopS), step = Math.round(0.5/hopS);
  const grvT = [], rawPerc = [];
  for (let o = 0; o < F; o += step) {
    const e = Math.min(F, o + win), c = e - o;
    let ob = 0, ot = 0, ld = 0;
    for (let i = Math.max(1, o); i < e; i++) {
      ob += Math.max(0, bassE[i]-bassE[i-1]);
      ot += Math.max(0, trebE[i]-trebE[i-1]);
      ld += loudE[i];
    }
    const p = (ob/c + percTrebleWeight*ot/c)/(ld/c + 0.02);
    rawPerc.push(p);
    grvT.push(Math.min(1, Math.max(0, (p - bakedPercLo)/(bakedPercHi - bakedPercLo))));
  }
  return {beats, strength, grv: grvT, grvHop: step*hopS, loud: loudE, hopS,
          rawPerc, bpm: 60/(P*hopS), dur: N/sr};
}
function bisect(a, t) {
  let lo2 = 0, hi2 = a.length;
  while (lo2 < hi2) { const m = (lo2+hi2)>>1; if (a[m] < t) lo2 = m+1; else hi2 = m; }
  return lo2;
}

// ---------- the groove + the sway + the nap ----------
const PUMP = [-1, -0.45, -1, 1, 0.45, 1];   // L l L R r R

// FIXME: left in the global scope for easier debugging
// NOTE: semantics changed — thresholds now apply to the bass ONSET
// (frame-to-frame rise) vs its own average rise, not to the bass level.
// A level detector can't see kicks over a sustained bassline; a rise can.
let pumpThrsMult = 1.7;
let pumpThrsAdd = 3;
let strongThrsMult = 2.6;   // stricter twin: feeds tempo estimate + sway PLL
let strongThrsAdd = 6;
// ballad boundary: percussiveness (bass onset flux / sustained loudness)
// below percLo -> full sway, above percHi -> full pump
let balladPercLo = 0.05, balladPercHi = 0.15;
// hats/snares are the loudest onset machines in a mix and they live up
// top — treble onset flux counts extra toward percussiveness
let percTrebleWeight = 2.5;
// baked-track boundary (offline units: envelopes normalized to song peak)
let bakedPercLo = 0.05, bakedPercHi = 0.15;
let LEAD_S = 0.14;   // pump wind-up starts this early; the kick lands ON the beat
// drowsy eyelid script over p in 0..1: blink, mostly reopen, heavier
// blink, barely reopen, closed for good (1 = open, 0 = closed)
const DROWSY = [[0,1],[0.13,0.12],[0.24,0.78],[0.42,0.04],[0.53,0.30],[0.72,0],[1,0]];
const SIL_DROWSY = 6000, SIL_ASLEEP = 10500;
let pump = 0, x = 0, xT = 0, dy = 0, kick = 0;
let loudEma = 0, lastBeat = 0;
// sway machinery: continuous phase, soft-PLL'd to detected beats
let grv = 1, phi = 0, T = 750, lastStrong = 0;
let fluxEma = 0, bassPrev = 0, xSway = 0, swayEnv = 0, perc = 0;
let trebPrev = 0, trebFluxEma = 0;
let eyeO = 1, eyeTarget = 1, surp = 0;       // eyeO: 0 closed .. 1 open
let mode = 'awake', lastSound = performance.now(), startleT0 = 0, sleepF = 0;
let th = [0,0,0,0], w = [0,0,0,0], xTickPrev = 0, prevV = 0;
let angles = [0,0,0,0], anglesPrev = [0,0,0,0], acc = 0, lastT = performance.now();
let beats = 0;
window.__dbg = () => ({x, beats, eyeO, playing, mode, sleepF, surp,
                       grv, perc, bpm: 60000/T, baked: !!baked,
                       bkBpm: baked ? baked.bpm : 0,
                       bkBeats: baked ? baked.beats.length : 0,
                       t: player.currentTime});
window.__bakedRaw = () => baked && {rawPerc: Array.from(baked.rawPerc),
                                    bpm: baked.bpm, dur: baked.dur};
window.__forceSleep = (ms) => { lastSound = performance.now() - (ms||20000); };

function drowsyEye(p) {
  for (let i = 1; i < DROWSY.length; i++) {
    if (p <= DROWSY[i][0]) {
      const [p0,v0] = DROWSY[i-1], [p1,v1] = DROWSY[i];
      return v0 + (v1-v0)*(p-p0)/(p1-p0);
    }
  }
  return 0;
}

function springTick(v) {   // the proven 12 Hz constants (vibing gain)
  const gain = 1.6, k = 0.25, c = 0.30, capIn = 10, capOut = 2.6;
  anglesPrev = angles.slice();
  for (let j = 0; j < 4; j++) {
    const mult = TUFTS[j][3], side = j < 2 ? 1 : -1;
    w[j] += -gain*mult*prevV - k*th[j] - c*w[j];
    th[j] += w[j];
    const lo = side > 0 ? -capIn : -capOut, hi = side > 0 ? capOut : capIn;
    const cl = Math.max(lo, Math.min(hi, th[j]));
    if (cl !== th[j]) w[j] = 0;
    th[j] = cl;
  }
  prevV = v;
  angles = th.slice();
}

function startle(now) {
  mode = 'startle'; startleT0 = now;
  kick = -3.4;
  for (const z of ZZZ) document.getElementById(z).style.opacity = 0;
  // tuft flare: inward impulse, like a full-body flinch
  for (let j = 0; j < 4; j++) w[j] += (j < 2 ? -2.6 : 2.6)*TUFTS[j][3];
  statusEl.textContent = '!!';
}

function loop(now) {
  if (window.__freeze) { requestAnimationFrame(loop); return; }   // test hook
  const dt = Math.min(50, now - lastT); lastT = now;
  const useBaked = !!(baked && srcNode === fileNode && playing && !player.paused);
  let bass = 0, total = 0;
  if (analyser && playing) {
    analyser.getByteFrequencyData(freq);
    for (let i = 1; i <= 6; i++) bass += freq[i];
    bass /= 6;
    for (let i = 0; i < 64; i++) total += freq[i];
    total /= 64;
    loudEma = loudEma*0.95 + total*0.05;
    // onset: the RISE of bass energy this frame — kicks spike it even
    // over a sustained bassline, which a level detector cannot see
    const onset = Math.max(0, bass - bassPrev);
    bassPrev = bass;
    fluxEma = fluxEma*0.97 + onset*0.03;
    // treble onset flux: bins ~1.9-9.4 kHz, where hats and snares snap
    let treb = 0;
    for (let i = 40; i <= 200; i++) treb += freq[i];
    treb /= 161;
    trebFluxEma = trebFluxEma*0.97 + Math.max(0, treb - trebPrev)*0.03;
    trebPrev = treb;
    // percussiveness for the sway blend: bass + weighted treble onsets
    perc = (fluxEma + percTrebleWeight*trebFluxEma) / (loudEma + 6);
    if (window.__logBeats)
      console.log(`onset: ${onset.toFixed(1)}; fluxEma: ${fluxEma.toFixed(2)}; ` +
        `trebFlux: ${trebFluxEma.toFixed(2)}; ` +
        `thrs: ${(fluxEma*pumpThrsMult + pumpThrsAdd).toFixed(2)}; perc: ${perc.toFixed(3)}`);
    // beat: onset pops above its own recent average (live sources only —
    // a baked track drives the pump from its beat grid instead)
    if (!useBaked && onset > fluxEma*pumpThrsMult + pumpThrsAdd && now - lastBeat > 180) {
      lastBeat = now; beats++;
      pump = (pump + 1) % PUMP.length;
      const amp = 1.1 + Math.min(2.1, loudEma/26);
      xT = PUMP[pump] * amp;
      kick = Math.min(kick, -Math.min(2.4, 0.8 + onset/14));
    }
    // strong-beat detector (stricter) — feeds tempo estimate + sway PLL
    if (!useBaked && onset > fluxEma*strongThrsMult + strongThrsAdd && now - lastStrong > 250) {
      const ibi = now - lastStrong;
      if (ibi > 300 && ibi < 1600) T = T*0.85 + ibi*0.15;
      lastStrong = now;
      // pull the sway so an extreme lands on this beat (soft PLL)
      const tgt = Math.round((phi - Math.PI/2)/Math.PI)*Math.PI + Math.PI/2;
      phi += (tgt - phi)*0.22;
    }
    // grooviness: percussive music pumps, sustained music sways
    if (!useBaked) {
      const gT = Math.min(1, Math.max(0, (perc - balladPercLo)/(balladPercHi - balladPercLo)));
      grv += (gT - grv)*0.015;
    }
  }
  const soundNow = playing && total > 6;
  if (soundNow) lastSound = now;
  const sil = now - lastSound;

  // ---- mode machine ----
  if (mode === 'startle') {
    if (now - startleT0 > 900) {
      mode = 'awake';
      statusEl.textContent = 'okay, okay — awake ♪';
    }
  } else if (mode === 'asleep') {
    if (soundNow) startle(now);          // only true sleep earns the startle
  } else {
    const prev = mode;
    mode = sil > SIL_ASLEEP ? 'asleep' : sil > SIL_DROWSY ? 'drowsy' : 'awake';
    if (mode === 'asleep' && prev !== 'asleep') statusEl.textContent = 'zzz . . .';
  }

  // ---- eyes ----
  let ease = 0.10;
  if (mode === 'startle') {
    const st = now - startleT0;
    surp += ((st < 620 ? 1 : 0) - surp) * 0.45;
    eyeTarget = 0;                       // melt into groove-closed underneath
    // rays flicker: on, off, on, gone
    const g28 = document.getElementById('g28');
    const on = st < 130 || (st > 210 && st < 330);
    g28.style.display = on ? '' : 'none';
  } else {
    surp += (0 - surp) * 0.45;
    if (mode === 'asleep') { eyeTarget = 0; ease = 0.06; }
    else if (mode === 'drowsy') {
      eyeTarget = drowsyEye((sil - SIL_DROWSY)/(SIL_ASLEEP - SIL_DROWSY));
      ease = 0.25;                       // blinks need to land
    } else eyeTarget = (playing && sil < 1800) ? 0 : 1;
  }
  eyeO += (eyeTarget - eyeO) * ease;

  // ---- sleep depth: slow to sink, quick to surface ----
  const sTgt = mode === 'asleep' ? 1 : 0;
  sleepF += (sTgt - sleepF) * (sTgt ? 0.012 : 0.35);

  // ---- baked track: she has heard this song before ----
  if (useBaked && soundNow) {
    const t = player.currentTime;
    if (Math.abs(t - bkPrevT) > 0.6) {       // seek / loop restart
      bkBi = bisect(baked.beats, t); bkPend = [];
    }
    bkPrevT = t;
    const li = Math.min(baked.loud.length-1, Math.max(0, Math.floor(t/baked.hopS)));
    const gi = Math.min(baked.grv.length-1, Math.floor(t/baked.grvHop));
    grv += (baked.grv[gi] - grv)*0.05;
    // anticipation: wind-up starts LEAD_S before the beat...
    while (bkBi < baked.beats.length && t >= baked.beats[bkBi] - LEAD_S) {
      const amp = 1.1 + 2.1*Math.min(1, baked.loud[li]*1.6);
      xT = PUMP[bkBi % PUMP.length] * amp;
      bkPend.push(bkBi); bkBi++;
    }
    // ...and the impact lands ON it
    while (bkPend.length && t >= baked.beats[bkPend[0]]) {
      const s = baked.strength[bkPend.shift()];
      kick = Math.min(kick, -Math.min(2.4, 0.7 + 0.6*s));
      beats++;
    }
    // sway phase straight off the grid: extremes exactly on beats —
    // half-time on fast grids, the way people actually sway to slow songs
    const div = baked.bpm > 85 ? 2 : 1;
    const k = Math.min(baked.beats.length-2, Math.max(0, bisect(baked.beats, t)-1));
    const frac = Math.min(1, Math.max(0,
      (t - baked.beats[k])/(baked.beats[k+1] - baked.beats[k] || 1)));
    const ph = Math.PI*(k + frac)/div;
    phi = ph + Math.PI/2;
    const swayA = 1.6 + 1.6*Math.min(1, baked.loud[li]*1.6);
    xSway = swayA*Math.cos(ph);
  }

  // ---- motion integration ----
  if (soundNow) {
    if (!useBaked) {
      phi += dt*Math.PI/T;               // half cycle per beat: penlight sway
      const swayA = 1.6 + Math.min(1.6, loudEma/30);
      xSway = swayA*Math.sin(phi);
    }
    swayEnv += (1 - swayEnv)*0.05;
  } else {
    xT *= 0.92; xSway *= 0.92;           // both vocabularies drain in silence
    swayEnv *= 0.92;
  }
  const xTarget = grv*xT + (1-grv)*xSway;
  x += (xTarget - x) * 0.30;
  kick *= 0.86;
  const bobAwake = 0.30*Math.sin(now/380);
  const bobSleep = 0.60*Math.sin(now/520) + 1.1;  // deep breath, settled down
  // ballad: kicks soften, and she settles gently into each side of the sway
  dy = bobAwake + (bobSleep - bobAwake)*sleepF + kick*(0.3 + 0.7*grv)
     + (1-grv)*swayEnv*0.45*(0.5 - 0.5*Math.cos(2*phi));
  const lean = 2.0*sleepF;
  // tuft springs at the proven 12 Hz, lerped to display rate
  acc += dt;
  if (acc >= 83.3) {
    acc -= 83.3;
    springTick(x - xTickPrev);
    xTickPrev = x;
  }
  const f = Math.min(1, acc/83.3);
  const disp = angles.map((a,j)=>anglesPrev[j] + (a-anglesPrev[j])*f);
  zzz(now, sleepF);
  render(x + lean, dy, eyeO, surp, disp);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// hidden test hooks: synthetic sources into the analyser (no speakers)
function addHats(ms) {   // highpassed noise ticks — a fake hi-hat
  const nb = AC.createBuffer(1, AC.sampleRate/2, AC.sampleRate);
  const ch = nb.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = Math.random()*2 - 1;
  const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5000;
  const hg = AC.createGain(); hg.gain.value = 0;
  ns.connect(hp); hp.connect(hg); hg.connect(analyser); ns.start();
  setInterval(() => {
    const t = AC.currentTime;
    hg.gain.cancelScheduledValues(t);
    hg.gain.setValueAtTime(0.5, t);
    hg.gain.exponentialRampToValueAtTime(0.01, t + 0.06);
  }, ms);
}
window.__vibeTest = (ms) => {
  ensureAC();
  const osc = AC.createOscillator(); osc.type = 'sine'; osc.frequency.value = 70;
  const g = AC.createGain(); g.gain.value = 0;
  osc.connect(g); g.connect(analyser);
  osc.start();
  setInterval(() => {
    const t = AC.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.02, t + 0.18);
  }, ms || 430);
  addHats((ms || 430)/2);
  playing = true;
  statusEl.textContent = 'test groove ♪';
};
window.__basslineTest = () => {
  // the level-detector killer: sustained in-band bass + kicks on top
  ensureAC();
  const bed = AC.createOscillator(); bed.frequency.value = 80;
  const bg2 = AC.createGain(); bg2.gain.value = 0.35;
  bed.connect(bg2); bg2.connect(analyser); bed.start();
  const osc = AC.createOscillator(); osc.frequency.value = 65;
  const og = AC.createGain(); og.gain.value = 0;
  osc.connect(og); og.connect(analyser); osc.start();
  setInterval(() => {
    const t = AC.currentTime;
    og.gain.cancelScheduledValues(t);
    og.gain.setValueAtTime(0.8, t);
    og.gain.exponentialRampToValueAtTime(0.02, t + 0.15);
  }, 500);
  addHats(250);
  playing = true;
  statusEl.textContent = 'test bassline ♪';
};
window.__balladTest = () => {
  ensureAC();
  // sustained "strings": sawtooth pad with slow swells
  const pad = AC.createOscillator(); pad.type = 'sawtooth'; pad.frequency.value = 220;
  const pg = AC.createGain(); pg.gain.value = 0.25;
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.15;
  const lg = AC.createGain(); lg.gain.value = 0.12;
  lfo.connect(lg); lg.connect(pg.gain);
  pad.connect(pg); pg.connect(analyser);
  pad.start(); lfo.start();
  // soft slow heartbeat at ~72 bpm for the sway to lock onto
  const osc = AC.createOscillator(); osc.frequency.value = 60;
  const og = AC.createGain(); og.gain.value = 0;
  osc.connect(og); og.connect(analyser); osc.start();
  setInterval(() => {
    const t = AC.currentTime;
    og.gain.cancelScheduledValues(t);
    og.gain.setValueAtTime(0.30, t);
    og.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
  }, 830);
  playing = true;
  statusEl.textContent = 'test ballad ♪';
};
