<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucia Vibe Mode</title>
<style>
  :root { --sand:#e0cda8; --ink:#17191c; --paper:#f4ead2; --verm:#c9483a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: Georgia, "Iowan Old Style", serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px 14px;
  }
  .card {
    background: var(--sand); border: 2px solid var(--ink); border-radius: 18px;
    padding: 18px 22px 14px; width: min(480px, 94vw);
    box-shadow: 6px 6px 0 rgba(23,25,28,.18); text-align: center;
  }
  .stage svg { width: min(320px, 78vw); height: auto; }
  .status { font-size: .8rem; min-height: 1.2em; opacity: .75; font-style: italic; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  button {
    font-family: inherit; font-size: .8rem; padding: 8px 14px;
    border: 1.5px solid var(--ink); border-radius: 10px;
    background: var(--paper); color: var(--ink); cursor: pointer;
  }
  button:hover { transform: translateY(-1px); }
  button.on { background: var(--ink); color: var(--sand); }
  audio { width: 100%; height: 30px; margin-top: 10px; display: none; }
  .hint { font-size: .68rem; opacity: .5; margin: 2px 0 0; font-style: italic; }
</style>
</head>

  and she hears everything the machine plays</p>

<script>
// ---------- rig setup ----------
const S = {};
// pivots sit at each tuft's root, just inside the face fill (path42),
// so the buried end sweeps under the fill instead of opening a gap
const TUFTS = [["path17",67.0,117.0,0.8],["path15",67.5,120.5,1.0],
               ["path16",107.2,120.0,1.0],["path18",107.0,119.5,0.8]];
const ZZZ = ['path41-1','path41','path41-4'];   // small -> large
(function setup() {
  const ids = {g7:['path19','path19-5'], g6:['path3','path6'], g8:['path1','path8']};
  const NP = 30, refL = [71.476,115.386], refR = [101.806,115.158];
  const OPEN = new Set(['g7']);
  for (const [gid,[l,r]] of Object.entries(ids)) {
    const smp = (pid, ref) => {
      const el = document.getElementById(pid);
      const len = el.getTotalLength();
      const n = OPEN.has(gid) ? NP/2 : NP;
      let pts = [];
      for (let k = 0; k < n; k++) {
        const p = el.getPointAtLength(len*k/(n-1));
        pts.push([p.x, p.y]);
      }
      const d0 = Math.hypot(pts[0][0]-ref[0], pts[0][1]-ref[1]);
      const d1 = Math.hypot(pts[n-1][0]-ref[0], pts[n-1][1]-ref[1]);
      if (d1 < d0) pts.reverse();
      if (OPEN.has(gid)) pts = pts.concat(pts.slice().reverse());
      return pts;
    };
    S[gid] = {L: smp(l, refL), R: smp(r, refR)};
  }
  // hide everything not needed: eye states, smoke, naruto, vein, rays, sigh
  for (const g of ['g7','g6','g8','g24','g26','g30',
                   'g39','g36','g38','g35','g40','g27','g28','g32']) {
    const el = document.getElementById(g);
    if (el) el.style.display = 'none';
  }
  document.getElementById('g25').style.opacity = 0;
  for (const z of ZZZ) document.getElementById(z).style.opacity = 0;
  const g11 = document.getElementById('g11');
  // front layer: the eyes ride here and get extra parallax on head turns,
  // so the face reads convex instead of flat (whiskers g2 get the same
  // transform in place, to keep the author's z-order)
  const fg = document.createElementNS('http://www.w3.org/2000/svg','g');
  fg.id = 'gFront';
  g11.appendChild(fg);
  for (const nm of ['morphL','morphR']) {
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.id = nm;
    p.setAttribute('style',
      'fill:none;stroke:#17191c;stroke-width:1.97793;stroke-linecap:round;stroke-linejoin:round');
    fg.appendChild(p);
  }
})();

function render(dx, dy, eyeO, surp, angles) {
  const rot = (0.9*dx).toFixed(3);
  document.getElementById('g23').setAttribute('transform',
    `translate(${(11.449+0.55*dx).toFixed(3)} ${(6.862+dy).toFixed(3)})` +
    `scale(.87579)rotate(${rot} 86.6 163)`);
  const sx = 1 - 0.004*Math.abs(dx), fxc = 86.6*(1-sx);
  document.getElementById('g11').setAttribute('transform',
    `translate(${(0.55*dx+fxc).toFixed(3)} 0)scale(${sx.toFixed(4)} 1)`);
  // convexity: front features (eyes + whiskers) travel farther than the
  // face oval and compress a touch more — three depth layers total
  const s2 = 1 - 0.0025*Math.abs(dx);
  const ftr = `translate(${(0.60*dx + 86.6*(1-s2)).toFixed(3)} 0)scale(${s2.toFixed(4)} 1)`;
  document.getElementById('gFront').setAttribute('transform', ftr);
  document.getElementById('g2').setAttribute('transform', ftr);
  for (const [side, pid] of [['L','morphL'],['R','morphR']]) {
    const A = S.g7[side], B = S.g6[side], C = S.g8[side];
    const pts = A.map((p,k)=>{
      const x0 = p[0]+(B[k][0]-p[0])*eyeO, y0 = p[1]+(B[k][1]-p[1])*eyeO;
      return [x0+(C[k][0]-x0)*surp, y0+(C[k][1]-y0)*surp];
    });
    document.getElementById(pid).setAttribute('d',
      'M'+pts.map(p=>p[0].toFixed(2)+' '+p[1].toFixed(2)).join('L'));
  }
  angles.forEach((a,j)=>{
    const [id,cx,cy] = TUFTS[j];
    document.getElementById(id).setAttribute('transform',`rotate(${a.toFixed(2)} ${cx} ${cy})`);
  });
}

// floating zzz: each glyph loops fade-in / drift-up / fade-out, staggered
// small -> mid -> large like a snore swelling. s gates them as sleep deepens.
function zzz(now, s) {
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById(ZZZ[i]);
    if (s < 0.55) { el.style.opacity = 0; continue; }
    const ph = ((now/2600) + i*0.333) % 1;
    const op = ph < 0.18 ? ph/0.18 : ph < 0.66 ? 1 : (1-ph)/0.34;
    el.style.opacity = (op * (s-0.55)/0.45).toFixed(3);
    el.setAttribute('transform',
      `translate(${(2.2*ph).toFixed(2)} ${(-7*ph).toFixed(2)})`);
  }
}

// =====================================================================
//  sound -> motion
//
//    source --> driver --------------------> features --> motion --> render
//               baked grid   (files)         { b, bpm, energy,
//               live clock   (tab / mic)       groove, conf, ... }
//
//  The one rule: everything that moves is a smooth function of a
//  continuous beat number b (beat k lands exactly on b = k), passed
//  through springs. Detections only ever *steer the clock*; they never
//  yank the head. (Event-driven targets + first-order easing made
//  velocity jump on every hit — that was the twitch.)
// =====================================================================
const CFG = {
  // analysis bands (Hz), shared by live + baked ears so both hear alike
  bands:  [[30, 120], [120, 400], [400, 1500], [1500, 4500], [4500, 11000]],
  bandW:  [1.0, 0.6, 0.35, 0.5, 0.8],   // how much each band's onsets count
  floorDb: 45,             // this far under a band's peak counts as silence
  tempoPrior: 120, tempoOct: 1.0,       // log-gaussian tempo preference
  slowBpm: [76, 96],       // below this ramp she sways however hard it hits
  halfTime: [88, 96],      // sway on every other beat above this (hysteresis)
  grooveBaked: [5, 15],    // on-beat onset strength (weighted dB) -> 0..1 pump
  grooveLive:  [4, 12],
  liveSilenceDb: -70,      // analyser band-sum under this = silence
  bakedSilenceDb: -45,     // re. song peak
  avOffset: 0.03,          // s, draw slightly ahead of the audio
  liveLatency: 0.07,       // s, capture + analysis lag on tab / mic
  arrive: 0.5,             // beats: pump spring time-to-peak (targets switch this early)
  zeta: 0.55,              // pump/sway spring damping: ~13% overshoot, a soft landing
  pumpAmp: [1.0, 3.1], swayAmp: [1.3, 2.9],      // [quiet, loud]
  nodDepth: [0.35, 1.5], swayDip: [0.25, 0.7],
};
const PUMP = [-1, -0.45, -1, 1, 0.45, 1];   // L l L R r R
// drowsy eyelid script over p in 0..1: blink, mostly reopen, heavier
// blink, barely reopen, closed for good (1 = open, 0 = closed)
const DROWSY = [[0,1],[0.13,0.12],[0.24,0.78],[0.42,0.04],[0.53,0.30],[0.72,0],[1,0]];
const SIL_DROWSY = 6000, SIL_ASLEEP = 10500;

// ---------- small math ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a)*t;
const mix = (r, t) => r[0] + (r[1] - r[0])*t;
const sstep = (a, b, v) => { const t = clamp((v - a)/(b - a), 0, 1); return t*t*(3 - 2*t); };
const mod = (n, m) => ((n % m) + m) % m;
const approach = (cur, tgt, tau, dt) => tgt + (cur - tgt)*Math.exp(-dt/tau);   // s, s
const tempoWeight = (bpm) =>
  Math.exp(-0.5*Math.pow(Math.log2(bpm/CFG.tempoPrior)/CFG.tempoOct, 2));
function bisect(a, t) {
  let lo = 0, hi = a.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] < t) lo = m + 1; else hi = m; }
  return lo;
}

// ---------- audio plumbing ----------
let AC = null, analyser = null, spec = null, bandBins = null;
let srcKind = null, srcNode = null, stream = null, fileNode = null, fileUrl = null;
let testNodes = [], testTimers = [];
let baked = null, bakeToken = 0;
const statusEl = document.getElementById('status');
const player = document.getElementById('player');

function ensureAC() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    analyser = AC.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0;     // flux wants raw frames
    spec = new Float32Array(analyser.frequencyBinCount);
    const hz = AC.sampleRate/analyser.fftSize;
    bandBins = CFG.bands.map(([lo, hi]) =>
      [Math.max(1, Math.round(lo/hz)), Math.min(spec.length - 1, Math.round(hi/hz))]);
  }
  if (AC.state === 'suspended') AC.resume();
}
function stopSource() {
  if (srcNode) { try { srcNode.disconnect(); } catch (e) {} srcNode = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  testNodes.forEach(n => { try { n.stop(); } catch (e) {} });
  testTimers.forEach(clearInterval);
  testNodes = []; testTimers = [];
  player.pause(); player.style.display = 'none';
  srcKind = null; baked = null; bakeToken++;
  liveReset();
  for (const b of ['btnTab', 'btnFile', 'btnMic'])
    document.getElementById(b).classList.remove('on');
}
function setOn(id, kind, msg) {
  if (id) document.getElementById(id).classList.add('on');
  srcKind = kind;
  statusEl.textContent = msg;
}

document.getElementById('btnTab').onclick = async () => {
  stopSource(); ensureAC();
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({video: true, audio: true});
    stream.getVideoTracks().forEach(t => t.stop());
    if (!stream.getAudioTracks().length) {
      statusEl.textContent = 'no audio in that share — pick a tab and tick "share tab audio"';
      return;
    }
    srcNode = AC.createMediaStreamSource(stream);
    srcNode.connect(analyser);
    setOn('btnTab', 'tab', 'listening to the shared audio ♪');
  } catch (e) { statusEl.textContent = 'share cancelled'; }
};
document.getElementById('btnFile').onclick = () => document.getElementById('filein').click();
document.getElementById('filein').onchange = (ev) => {
  const f = ev.target.files[0];
  ev.target.value = '';                    // picking the same file again still fires
  if (f) loadFile(f);
};
async function loadFile(f) {
  stopSource(); ensureAC();
  const token = bakeToken;
  if (fileUrl) URL.revokeObjectURL(fileUrl);
  player.src = fileUrl = URL.createObjectURL(f);
  player.style.display = 'block';
  if (!fileNode) fileNode = AC.createMediaElementSource(player);
  fileNode.connect(analyser);
  fileNode.connect(AC.destination);
  srcNode = fileNode;
  MC.ok = false;
  player.play().catch(() => {});
  // live ears carry her until the bake lands
  setOn('btnFile', 'file', `${f.name} — reading the song… ♪`);
  try {
    const b = await bakeTrack(await f.arrayBuffer());
    if (token !== bakeToken) return;       // another source took over meanwhile
    if (b) {
      baked = b;
      statusEl.textContent = `${f.name} — she knows this one ♪ (${b.bpm.toFixed(0)} bpm)`;
    } else statusEl.textContent = `${f.name} — no steady beat here, she'll just feel it ♪`;
  } catch (e) { /* undecodable: stay on the live ears */ }
}
document.getElementById('btnMic').onclick = async () => {
  stopSource(); ensureAC();
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: {
      echoCancellation: false, noiseSuppression: false, autoGainControl: false}});
    srcNode = AC.createMediaStreamSource(stream);
    srcNode.connect(analyser);
    setOn('btnMic', 'mic', 'listening ♪ (monitor source = whole system)');
  } catch (e) { statusEl.textContent = 'mic denied'; }
};

// ---------- line boil: stepped re-seeding, held on threes ----------
let boilOn = false, boilPhase = -1;
document.getElementById('btnBoil').onclick = (ev) => {
  boilOn = !boilOn;
  ev.target.classList.toggle('on', boilOn);
  if (!boilOn) { document.getElementById('g23').removeAttribute('filter'); boilPhase = -1; }
};
function boil(now) {
  if (!boilOn) return;
  const ph = Math.floor(now/150) % 3;        // ~6.7 redraws/s, snapped
  if (ph !== boilPhase) {
    boilPhase = ph;
    document.getElementById('g23').setAttribute('filter', `url(#boil${ph+1})`);
  }
}

// ---------- live ears: a beat clock that listens ----------
// Onsets (multi-band log flux) land on a fixed 60 Hz grid. Ten times a
// second we autocorrelate the last 8 s for tempo and comb-filter it for
// phase, then *steer* a free-running clock by bending its rate — so b
// never jumps, it just catches up. False hits barely move it.
const LFS = 60, LN = 8*LFS;
const LV = {};
const lvO = new Float32Array(LN), lvS = new Float32Array(LN), lvA = new Float32Array(LN);
function liveReset() {
  Object.assign(LV, {
    grid: new Float32Array(LN), head: 0, filled: 0, gT: -1, lastT: -1, lastO: 0,
    prevDb: null, peakDb: null, peakTot: -200, totDb: -200,
    T: 0.5, disagree: 0, b: 0, rate: 2, rateT: 2, nextEst: 0,
    conf: 0, groove: 0, energy: 0, sound: false, div: 2, announced: false,
  });
}
liveReset();

function liveFrame(t, dt) {
  analyser.getFloatFrequencyData(spec);
  const nb = bandBins.length, db = new Array(nb);
  let tot = 0;
  for (let i = 0; i < nb; i++) {
    let p = 0;
    for (let k = bandBins[i][0]; k <= bandBins[i][1]; k++) p += Math.pow(10, spec[k]/10);
    tot += p;
    db[i] = 10*Math.log10(p + 1e-20);
  }
  LV.totDb = 10*Math.log10(tot + 1e-20);
  LV.sound = LV.totDb > CFG.liveSilenceDb;
  // onset strength: positive dB steps per band, floored under a slow peak
  if (!LV.peakDb) LV.peakDb = db.slice();
  let o = 0;
  for (let i = 0; i < nb; i++) {
    LV.peakDb[i] = Math.max(db[i], LV.peakDb[i] - 1.5*dt);
    const fl = Math.max(LV.peakDb[i] - CFG.floorDb, -110);
    if (LV.prevDb) {
      const a = Math.max(db[i], fl), p = Math.max(LV.prevDb[i], fl);
      if (a > p) o += CFG.bandW[i]*(a - p);
    }
  }
  LV.prevDb = db;
  o *= clamp(1/(60*Math.max(dt, 1e-3)), 0.25, 4);    // per 60th, any refresh rate
  // resample onto the fixed grid
  if (LV.gT < 0 || t - LV.gT > 0.5) {               // first frame / tab was hidden
    LV.gT = t; LV.lastT = t; LV.lastO = o; LV.filled = 0;
  }
  while (LV.gT + 1/LFS <= t) {
    LV.gT += 1/LFS;
    const a = (LV.gT - LV.lastT)/Math.max(1e-6, t - LV.lastT);
    LV.grid[LV.head] = LV.lastO + (o - LV.lastO)*a;
    LV.head = (LV.head + 1) % LN;
    LV.filled = Math.min(LN, LV.filled + 1);
  }
  LV.lastT = t; LV.lastO = o;
  // loudness vs a slowly releasing peak: volume-independent energy
  LV.peakTot = Math.max(LV.totDb, LV.peakTot - 0.5*dt);
  LV.energy = approach(LV.energy, sstep(-26, -3, LV.totDb - LV.peakTot), 0.3, dt);
  // run the clock, then (sometimes) listen and steer it
  LV.rate = approach(LV.rate, LV.rateT, 0.25, dt);
  LV.b += dt*LV.rate;
  if (t >= LV.nextEst && LV.filled >= 3*LFS) { LV.nextEst = t + 0.1; liveEstimate(t); }
  if (!LV.sound) LV.conf = approach(LV.conf, 0, 1.5, dt);
  return {
    b: LV.b + (CFG.liveLatency + CFG.avOffset)*LV.rate,   // predict past the lag
    bpm: 60/LV.T, energy: LV.energy, groove: LV.groove, conf: LV.conf,
    sound: LV.sound, div: LV.div, accent: 1,
  };
}

function liveEstimate(t) {
  const n = LV.filled;
  for (let i = 0; i < n; i++) lvO[i] = LV.grid[(LV.head - n + i + LN) % LN];
  let mean = 0;
  for (let i = 0; i < n; i++) {
    lvS[i] = (lvO[Math.max(0, i - 1)] + 2*lvO[i] + lvO[Math.min(n - 1, i + 1)])/4;
    mean += lvO[i];
  }
  mean /= n;
  // tempo: autocorrelation, harmonically enhanced, prior + continuity weighted
  const lMin = Math.floor(LFS*60/220), lMax = Math.ceil(LFS*60/50);
  const lTop = Math.min(n - 1, 2*lMax + 1);
  for (let L = 0; L <= lTop; L++) {
    let s = 0;
    for (let i = L; i < n; i++) s += (lvO[i] - mean)*(lvO[i - L] - mean);
    lvA[L] = s/(n - L);
  }
  if (lvA[0] < 1e-6) { LV.conf = approach(LV.conf, 0, 1.0, 0.1); return; }
  const sc = [];
  let best = -Infinity, bL = lMin;
  for (let L = lMin; L <= lMax; L++) {
    const near = Math.exp(-0.5*Math.pow(Math.log2(L/LFS/LV.T)/0.1, 2));
    sc[L] = (lvA[L] + 0.5*lvA[Math.min(2*L, lTop)])*tempoWeight(LFS*60/L)*(0.6 + 0.4*near);
    if (sc[L] > best) { best = sc[L]; bL = L; }

    if (Math.abs(Math.log2(Pc/LV.T)) < 0.1) { LV.T += (Pc - LV.T)*0.2; LV.disagree = 0; }
    else if (++LV.disagree >= (LV.conf < 0.3 ? 3 : 15)) { LV.T = Pc; LV.disagree = 0; }
  }
  // phase: comb over the recent past — where do beats keep landing?
  const T = LV.T, K = Math.max(1, Math.min(8, Math.floor(n/LFS/T) - 1));
  const steps = Math.max(1, Math.round(T*LFS));
  let bS = -1, bPh = 0, sum = 0;

  const fC = LV.b - (t - LV.gT)*LV.rate;            // clock at the newest grid sample
  let e = bPh/T - (fC - Math.floor(fC));
  e -= Math.round(e);                               // wrap to [-0.5, 0.5]
  const cT = sstep(0.08, 0.35, clar)*sstep(0.4, 1.5, (bS - mS)/(mS + 0.05));
  LV.conf = approach(LV.conf, LV.sound ? cT : 0, 1.0, 0.1);
  LV.rateT = (1 + clamp(0.35*e, -0.2, 0.2)*(0.3 + 0.7*cT))/T;
  const bpm = 60/T;
  LV.groove = approach(LV.groove,
    sstep(CFG.grooveLive[0], CFG.grooveLive[1], bS)*sstep(CFG.slowBpm[0], CFG.slowBpm[1], bpm),
    2.0, 0.1);
  if (LV.div === 1 && bpm > CFG.halfTime[1]) LV.div = 2;
  else if (LV.div === 2 && bpm < CFG.halfTime[0]) LV.div = 1;
  if (!LV.announced && LV.conf > 0.5 && srcKind !== 'file') {
    LV.announced = true;
    statusEl.textContent += ` ~${bpm.toFixed(0)} bpm`;
  }
}

// ---------- baked ears: study the whole song first ----------
// Same bands + flux as the live ears, but offline and with hindsight:
// global tempo by autocorrelation, beats by dynamic programming (Ellis
// 2007), then the grid is regularized so the clock runs silky.
async function bakeTrack(ab) {
  const src = await AC.decodeAudioData(ab);
  const SR = 22050, HOP = 256, FR = SR/HOP, nb = CFG.bands.length;
  const N = Math.ceil(src.duration*SR);
  if (N < SR*4) return null;
  // the AE trick, natively: one offline render, one channel per EQ'd band
  const oc = new OfflineAudioContext(nb, N, SR);
  const s = oc.createBufferSource(); s.buffer = src;
  const merge = oc.createChannelMerger(nb);
  CFG.bands.forEach(([lo, hi], i) => {
    let node = s;
    const stage = (type, fq) => { for (let r = 0; r < 2; r++) {
      const f = oc.createBiquadFilter(); f.type = type; f.frequency.value = fq;
      node.connect(f); node = f; } };
    if (i > 0) stage('highpass', lo);
    if (i < nb - 1) stage('lowpass', hi);
    node.connect(merge, 0, i);
  });
  merge.connect(oc.destination);
  s.start();
  const out = await oc.startRendering();

  // causal, so an attack registers on its own frame instead of early
  const nF = Math.floor(N/HOP), dB = [], raw = new Float32Array(nF);
  for (let i = 0; i < nb; i++) {
    const d = out.getChannelData(i), e = new Float32Array(nF);
    for (let f = 0; f < nF; f++) {
      let a = 0;
      for (let j = f*HOP, z = j + HOP; j < z; j++) a += d[j]*d[j];
      raw[f] = a/HOP;
    }
    for (let f = 0; f < nF; f++) {
      const a = 4*raw[f] + 3*(raw[f-1] || 0) + 2*(raw[f-2] || 0) + (raw[f-3] || 0);
      e[f] = 10*Math.log10(a/10 + 1e-12);
    }
    dB.push(e);
  }
  const pct = (arr, q) => { const c = Float32Array.from(arr).sort(); return c[Math.floor(q*(c.length - 1))]; };
  const loud = new Float32Array(nF);
  for (let f = 0; f < nF; f++) {
    let p = 0;
    for (let i = 0; i < nb; i++) p += Math.pow(10, dB[i][f]/10);
    loud[f] = 10*Math.log10(p + 1e-12);
  }
  const lPk = pct(loud, 0.995);
  for (let f = 0; f < nF; f++) loud[f] -= lPk;      // dB re. song peak
  const floors = dB.map(e => pct(e, 0.995) - CFG.floorDb);
  const ons = new Float32Array(nF);
  for (let f = 1; f < nF; f++) {
    let o = 0;
    for (let i = 0; i < nb; i++) {
      const a = Math.max(dB[i][f], floors[i]), p = Math.max(dB[i][f-1], floors[i]);
      if (a > p) o += CFG.bandW[i]*(a - p);
    }

  }

  let mean = 0;
  for (let f = 0; f < nF; f++) mean += ons[f];
  mean /= nF;
  const lMin = Math.floor(FR*60/220), lMax = Math.ceil(FR*60/50);
  const lTop = Math.min(nF - 1, 2*lMax + 1), A = new Float64Array(lTop + 1);
  for (let L = 0; L <= lTop; L++) {
    let acc = 0;
    for (let f = L; f < nF; f++) acc += (ons[f] - mean)*(ons[f - L] - mean);
    A[L] = acc/(nF - L);
  }
  if (!(A[0] > 0)) return null;
  const sc = new Float64Array(lMax + 2);
  let best = -Infinity, bL = lMin;
  for (let L = lMin; L <= lMax; L++) {
    sc[L] = (A[L] + 0.5*A[Math.min(2*L, lTop)])*tempoWeight(FR*60/L);
    if (sc[L] > best) { best = sc[L]; bL = L; }
  }

  if (bL > lMin && bL < lMax) {
    const a = sc[bL - 1], c = sc[bL + 1], den = a - 2*best + c;
    if (den < 0) P = bL + 0.5*(a - c)/den;

  let sd = 0;
  for (let f = 0; f < nF; f++) sd += (ons[f] - mean)*(ons[f] - mean);
  sd = Math.sqrt(sd/nF) || 1;
  const loc = new Float32Array(nF);
  for (let f = 0; f < nF; f++) loc[f] = ((ons[f-1] || 0) + 2*ons[f] + (ons[f+1] || 0))/(4*sd);

  for (let f = 0; f < nF; f++) {

    for (let d = dMin; d <= dMax && d <= f; d++) {

  const bf = [];
  for (let f = end; f >= 0; f = back[f]) bf.push(f);
  bf.reverse();
  const loudAt = (f) => loud[clamp(f, 0, nF - 1)];
  while (bf.length && loudAt(bf[0]) < CFG.bakedSilenceDb) bf.shift();
  while (bf.length && loudAt(bf[bf.length - 1]) < CFG.bakedSilenceDb) bf.pop();
  if (bf.length < 8) return null;

  // irons out per-beat jitter so the clock's speed never stutters
  const n = bf.length, t0 = bf.map(f => (f + 0.5)/FR), times = new Float64Array(n);

    const a = Math.max(0, i - 2), z = Math.min(n - 1, i + 2), m = z - a + 1;
    let sx = 0, sy = 0, sxx = 0, sxy = 0;
    for (let j = a; j <= z; j++) { sx += j; sy += t0[j]; sxx += j*j; sxy += j*t0[j]; }
    const k = (m*sxy - sx*sy)/(m*sxx - sx*sx);
    times[i] = (sy - k*sx)/m + k*i;
    if (i && times[i] < times[i - 1] + 0.1) times[i] = times[i - 1] + 0.1;
  }
  // per-beat character
  const str = bf.map(f => {
    let m = 0;
    for (let q = -2; q <= 2; q++) m = Math.max(m, ons[clamp(f + q, 0, nF - 1)]);
    return m;
  });
  const med = Float32Array.from(str).sort()[n >> 1] || 1;
  const bpm = 60*FR/P, slow = sstep(CFG.slowBpm[0], CFG.slowBpm[1], bpm);
  const energy = new Float32Array(n), groove = new Float32Array(n), accent = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const f0 = bf[i], f1 = i + 1 < n ? bf[i + 1] : f0 + Math.round(P);
    let l = 0, c = 0;
    for (let f = f0; f < f1 && f < nF; f++) { l += Math.pow(10, loud[f]/10); c++; }
    energy[i] = sstep(-26, -3, 10*Math.log10(l/Math.max(1, c) + 1e-12));
    // forward-looking window: she feels the chorus coming
    let p = 0, pc = 0;
    for (let j = Math.max(0, i - 2); j <= Math.min(n - 1, i + 5); j++) { p += str[j]; pc++; }
    groove[i] = sstep(CFG.grooveBaked[0], CFG.grooveBaked[1], p/pc)*slow;
    accent[i] = clamp(0.75 + 0.25*str[i]/med, 0.7, 1.35);
  }
  return {times, bpm, energy, groove, accent, loud, fr: FR, clar,
          conf: sstep(0.04, 0.2, clar),
          div: bpm > (CFG.halfTime[0] + CFG.halfTime[1])/2 ? 2 : 1,
          dur: src.duration};
}

// media clock: player.currentTime is coarse/jittery — run our own and
// only lean on it (snap on seeks / loops), minus the output latency
const MC = {t: 0, ok: false};
function mediaTime(dt) {
  const ct = player.currentTime, pred = MC.t + dt*player.playbackRate;
  MC.t = (!MC.ok || Math.abs(ct - pred) > 0.15) ? ct : pred + (ct - pred)*Math.min(1, 3*dt);
  MC.ok = true;
  return MC.t - (AC.outputLatency || 0) - (AC.baseLatency || 0);
}
function bakedFrame(t) {
  const bt = baked.times, n = bt.length;
  const k = clamp(bisect(bt, t) - 1, 0, n - 2);
  const b = k + (t - bt[k])/(bt[k + 1] - bt[k]);   // extrapolates past both ends
  const i = clamp(Math.floor(b), 0, n - 2), fr = clamp(b - i, 0, 1);
  const li = clamp(Math.floor(t*baked.fr), 0, baked.loud.length - 1);
  return {
    b, bpm: 60/(bt[i + 1] - bt[i]),
    energy: lerp(baked.energy[i], baked.energy[i + 1], fr),
    groove: lerp(baked.groove[i], baked.groove[i + 1], fr),
    conf: baked.conf,
    sound: baked.loud[li] > CFG.bakedSilenceDb,
    div: baked.div,
    accent: baked.accent[clamp(Math.round(b), 0, n - 1)],
  };
}

// ---------- features: pick a driver, keep b continuous ----------
let lastF = {b: 0, bpm: 120, energy: 0, groove: 0, conf: 0, sound: false, div: 2, accent: 1};
function features(t, dt) {
  let f;
  const fileIdle = srcKind === 'file' && (player.paused || player.ended);
  if (srcKind === 'file' && baked && !fileIdle) f = bakedFrame(mediaTime(dt) + CFG.avOffset);
  else if (srcKind && !fileIdle) f = liveFrame(t, dt);
  else f = {...lastF, b: lastF.b + dt*lastF.bpm/60, energy: 0, conf: 0, sound: false};
  // seeks, loops and driver hand-offs jump b: absorb the whole-beat part
  // so the L l L R r R pattern carries on (springs eat the fraction)
  const expect = M.b + dt*M.bpm/60;
  let b = f.b + M.bOff;
  if (Math.abs(b - expect) > 0.35) { M.bOff += Math.round(expect - b); b = f.b + M.bOff; }
  M.b = b;
  lastF = f;
  return f;
}

// ---------- motion: beat clock -> targets -> springs ----------
const SX = {p: 0, v: 0}, SY = {p: 0, v: 0}, SK = {p: 0, v: 0};
const M = {b: 0, bOff: 0, bpm: 120, gate: 0, energy: 0, grv: 0, conf: 0, divMix: 1};
const OMY = 40;     // nod smoother, critically damped: group delay = 2/OMY
function spring(s, tgt, om, z, dt) {   // semi-implicit, <= 4 ms substeps
  for (let r = dt; r > 1e-6; r -= 0.004) {
    const h = Math.min(r, 0.004);
    s.v += (om*om*(tgt - s.p) - 2*z*om*s.v)*h;
    s.p += s.v*h;
  }
}
function motion(f, dt, ts) {
  M.bpm = approach(M.bpm, f.bpm, 0.8, dt);
  M.gate = approach(M.gate, f.sound ? 1 : 0, f.sound ? 0.45 : 0.7, dt);
  M.energy = approach(M.energy, f.energy, 0.5, dt);
  M.grv = approach(M.grv, f.groove, 1.6, dt);
  M.conf = approach(M.conf, f.conf, 0.8, dt);
  M.divMix = approach(M.divMix, f.div === 2 ? 1 : 0, 1.0, dt);
  const T = 60/M.bpm, z = CFG.zeta, b = M.b, gate = M.gate;
  const om = Math.PI/(Math.sqrt(1 - z*z)*CFG.arrive*T);
  const g = M.grv*M.conf;                 // no confident beat, no pumping
  // pump: the target steps `arrive` beats early and the spring's time to
  // peak is exactly that, so her swing *lands* on the beat, then settles
  const pumpX = PUMP[mod(Math.floor(b + CFG.arrive), PUMP.length)]*mix(CFG.pumpAmp, M.energy);
  // sway: extremes on beats, advanced by the spring's own phase lag at
  // that frequency so the *output* peaks on the beat. half-time when fast
  const sway = (d) => {
    const ws = Math.PI/(d*T);
    return Math.cos(Math.PI*b/d + Math.atan2(2*z*om*ws, om*om - ws*ws));
  };
  const swayX = mix(CFG.swayAmp, M.energy)*lerp(sway(1), sway(2), M.divMix);
  const wob = 0.20*Math.sin(ts*0.83) + 0.12*Math.sin(ts*1.37 + 2);   // not a metronome
  spring(SX, gate*(g*pumpX + (1 - g)*swayX + wob), om, z, dt);

  const by = b + (2/OMY)/T;               // pre-compensate the smoother's lag

}

// ---------- the nap ----------
let eyeO = 1, surp = 0;                   // eyeO: 0 closed .. 1 open
let mode = 'awake', lastSound = performance.now(), startleT0 = 0, sleepF = 0;
let th = [0,0,0,0], w = [0,0,0,0], xTickPrev = 0, prevV = 0;
let angles = [0,0,0,0], anglesPrev = [0,0,0,0], acc = 0, lastT = performance.now();
window.__dbg = () => ({src: srcKind, mode, sleepF, eyeO, b: M.b, bpm: M.bpm,
  gate: M.gate, energy: M.energy, groove: M.grv, conf: M.conf, x: SX.p, y: SY.p,
  baked: !!baked, bakedBpm: baked ? baked.bpm : 0, bakedClar: baked ? baked.clar : 0,
  bakedBeats: baked ? Array.from(baked.times) : null,
  live: {bpm: 60/LV.T, conf: LV.conf, groove: LV.groove, db: LV.totDb},
  t: player.currentTime});
window.__forceSleep = (ms) => { lastSound = performance.now() - (ms || 20000); };

function drowsyEye(p) {
  for (let i = 1; i < DROWSY.length; i++) {
    if (p <= DROWSY[i][0]) {
      const [p0,v0] = DROWSY[i-1], [p1,v1] = DROWSY[i];
      return v0 + (v1-v0)*(p-p0)/(p1-p0);
    }
  }
  return 0;
}

function springTick(v) {   // the proven 12 Hz constants (vibing gain)
  const gain = 1.6, k = 0.25, c = 0.30, capIn = 10, capOut = 2.6;
  anglesPrev = angles.slice();
  for (let j = 0; j < 4; j++) {
    const mult = TUFTS[j][3], side = j < 2 ? 1 : -1;
    w[j] += -gain*mult*prevV - k*th[j] - c*w[j];
    th[j] += w[j];
    const lo = side > 0 ? -capIn : -capOut, hi = side > 0 ? capOut : capIn;
    const cl = Math.max(lo, Math.min(hi, th[j]));
    if (cl !== th[j]) w[j] = 0;
    th[j] = cl;
  }
  prevV = v;
  angles = th.slice();
}

function startle(now) {
  mode = 'startle'; startleT0 = now;
  SK.v -= 95;                              // a real hop, not a teleport
  for (const zz of ZZZ) document.getElementById(zz).style.opacity = 0;
  // tuft flare: inward impulse, like a full-body flinch
  for (let j = 0; j < 4; j++) w[j] += (j < 2 ? -2.6 : 2.6)*TUFTS[j][3];
  statusEl.textContent = '!!';
}

function loop(now) {
  if (window.__freeze) { requestAnimationFrame(loop); return; }   // test hook
  const dtMs = Math.min(50, now - lastT); lastT = now;
  const dt = dtMs/1000, ts = now/1000;
  const f = features(ts, dt);
  if (f.sound) lastSound = now;
  const sil = now - lastSound;

  // ---- mode machine ----
  if (mode === 'startle') {
    if (now - startleT0 > 900) {
      mode = 'awake';
      statusEl.textContent = 'okay, okay — awake ♪';
    }
  } else if (mode === 'asleep') {
    if (f.sound) startle(now);             // only true sleep earns the startle
  } else {
    const prev = mode;
    mode = sil > SIL_ASLEEP ? 'asleep' : sil > SIL_DROWSY ? 'drowsy' : 'awake';
    if (mode === 'asleep' && prev !== 'asleep') statusEl.textContent = 'zzz . . .';
  }

  let eyeTarget = 1, tau = 0.16;
  if (mode === 'startle') {
    const st = now - startleT0;
    surp = approach(surp, st < 620 ? 1 : 0, 0.028, dt);
    eyeTarget = 0;                         // melt into groove-closed underneath
    // rays flicker: on, off, on, gone
    const on = st < 130 || (st > 210 && st < 330);
    document.getElementById('g28').style.display = on ? '' : 'none';
  } else {
    surp = approach(surp, 0, 0.028, dt);
    if (mode === 'asleep') { eyeTarget = 0; tau = 0.27; }
    else if (mode === 'drowsy') {
      eyeTarget = drowsyEye((sil - SIL_DROWSY)/(SIL_ASLEEP - SIL_DROWSY));

  const lean = 2.0*sleepF;
  // tuft springs at the proven 12 Hz, lerped to display rate

  if (acc >= 83.3) {
    acc -= 83.3;
    springTick(SX.p - xTickPrev);
    xTickPrev = SX.p;
  }
  const fr = Math.min(1, acc/83.3);
  const disp = angles.map((a,j)=>anglesPrev[j] + (a-anglesPrev[j])*fr);
  zzz(now, sleepF);
  boil(now);
  render(SX.p + lean, dy, eyeO, surp, disp);
  if (window.__trace) window.__trace.push({t: ts, b: M.b, x: SX.p, y: dy,
    g: M.grv*M.conf, gate: M.gate, bpm: M.bpm});
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- hidden test hooks: synthetic sources (no speakers) ----------

}

    const t = AC.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(peak, t);
    g.gain.exponentialRampToValueAtTime(peak*0.02, t + decay);
  }, ms));
}
function tone(type, fq, gain) {            // osc -> gain -> analyser
  const o = AC.createOscillator(); o.type = type; o.frequency.value = fq;
  const g = AC.createGain(); g.gain.value = gain;
  o.connect(g); g.connect(analyser); o.start(); testNodes.push(o);
  return g;
}
function hats(ms) {                        // highpassed noise ticks — a fake hi-hat
  const nb = AC.createBuffer(1, AC.sampleRate/2, AC.sampleRate), ch = nb.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = Math.random()*2 - 1;
  const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5000;
  const g = AC.createGain(); g.gain.value = 0;
  ns.connect(hp); hp.connect(g); g.connect(analyser); ns.start(); testNodes.push(ns);
  pulse(g, 0.5, 0.06, ms);
}
window.__vibeTest = (ms = 430) => testSrc('test groove ♪', () => {
  pulse(tone('sine', 70, 0), 0.9, 0.18, ms);
  hats(ms/2);
});
window.__basslineTest = () => testSrc('test bassline ♪', () => {
  // the level-detector killer: sustained in-band bass + kicks on top
  tone('sine', 80, 0.35);
  pulse(tone('sine', 65, 0), 0.8, 0.15, 500);
  hats(250);
});
window.__balladTest = () => testSrc('test ballad ♪', () => {
  // sustained "strings" with slow swells + a soft ~72 bpm heartbeat
  const pg = tone('sawtooth', 220, 0.25);
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.15;
  const lg = AC.createGain(); lg.gain.value = 0.12;
  lfo.connect(lg); lg.connect(pg.gain); lfo.start(); testNodes.push(lfo);
  pulse(tone('sine', 60, 0), 0.30, 0.5, 830);
});
// a whole synthetic song through the real file path (decode -> bake -> play)
function wavBlob(buf) {
  const ch = buf.getChannelData(0), n = ch.length;
  const dv = new DataView(new ArrayBuffer(44 + 2*n));
  const W = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  W(0, 'RIFF'); dv.setUint32(4, 36 + 2*n, true); W(8, 'WAVE'); W(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, buf.sampleRate, true); dv.setUint32(28, 2*buf.sampleRate, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  W(36, 'data'); dv.setUint32(40, 2*n, true);
  for (let i = 0; i < n; i++) dv.setInt16(44 + 2*i, clamp(ch[i], -1, 1)*32767, true);
  return new Blob([dv], {type: 'audio/wav'});
}
window.__synthSong = async ({bpm = 124, secs = 40, ballad = false, jitter = 0,
                              bakeOnly = false} = {}) => {
  ensureAC();
  const sr = 44100, oc = new OfflineAudioContext(1, sr*secs, sr), T = 60/bpm;
  const nz = oc.createBuffer(1, sr, sr), ch = nz.getChannelData(0);
  for (let i = 0; i < sr; i++) ch[i] = Math.random()*2 - 1;
  const pad = oc.createOscillator(); pad.type = 'sawtooth'; pad.frequency.value = 220;
  const pg = oc.createGain(); pg.gain.value = ballad ? 0.15 : 0.05;
  pad.connect(pg); pg.connect(oc.destination); pad.start();
  for (let t = 0.5; t < secs - 1; t += T) {
    const at = t + (Math.random()*2 - 1)*jitter;
    const o = oc.createOscillator(), g = oc.createGain();
    if (ballad) {
      o.frequency.value = 60;
      g.gain.setValueAtTime(0, at);
      g.gain.linearRampToValueAtTime(0.25, at + 0.04);
      g.gain.exponentialRampToValueAtTime(0.001, at + 0.6);
    } else {
      o.frequency.setValueAtTime(130, at);
      o.frequency.exponentialRampToValueAtTime(45, at + 0.12);
      g.gain.setValueAtTime(0.9, at);
      g.gain.exponentialRampToValueAtTime(0.001, at + 0.3);
      const ha = at + T/2, hs = oc.createBufferSource(); hs.buffer = nz;
      const hp = oc.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
      const hg = oc.createGain();
      hg.gain.setValueAtTime(0.3, ha);
      hg.gain.exponentialRampToValueAtTime(0.001, ha + 0.05);
      hs.connect(hp); hp.connect(hg); hg.connect(oc.destination);
      hs.start(ha); hs.stop(ha + 0.06);
    }
    o.connect(g); g.connect(oc.destination); o.start(at); o.stop(at + 0.7);
  }
  const buf = await oc.startRendering();
  if (bakeOnly) return bakeTrack(await wavBlob(buf).arrayBuffer());
  return loadFile(new File([wavBlob(buf)], `synth-${bpm}${ballad ? '-ballad' : ''}.wav`,
                           {type: 'audio/wav'}));
};
